<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <title>淨海稽查員 · Ocean Cleanup Inspector</title>
  <style>
/* ============================================================
   淨海漁夫 — 樣式表 (RWD：手機優先，電腦自動適應)
   ============================================================ */

* {
  margin: 0; padding: 0; box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
  -webkit-touch-callout: none;          /* 禁止長按跳出選單 */
  -webkit-user-select: none;            /* 禁止文字選取（手機長按不再反白） */
  user-select: none;
}

:root {
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --accent: #19c3a6;
  --accent-dark: #0f8f7c;
  --gold: #ffcc44;
  --panel-bg: rgba(10, 30, 44, 0.96);
  --danger: #ff5e6c;
}

html, body {
  width: 100%; height: 100%;
  overflow: hidden;
  background: #04141f;
  font-family: "Segoe UI", "Microsoft JhengHei", "PingFang TC", system-ui, sans-serif;
  color: #eaf6ff;
  user-select: none;
  touch-action: none;
}

#game-root {
  position: fixed; inset: 0;
  width: 100vw; height: 100vh;   /* 舊瀏覽器後備值 */
  height: 100dvh;                /* 手機：動態視口高度，排除瀏覽器工具列，底部按鈕才不會被擋住 */
  overflow: hidden;
}

#game {
  position: absolute; inset: 0;
  width: 100%; height: 100%;
  display: block;
}

/* ---------- 頂部資訊列 ---------- */
#hud-top {
  position: absolute; top: 0; left: 0; right: 0;
  padding: calc(8px + var(--safe-top)) 12px 8px;
  display: flex; gap: 8px; align-items: center;
  z-index: 10;
  pointer-events: none;
}
.stat {
  display: flex; align-items: center; gap: 6px;
  background: rgba(6, 22, 34, 0.7);
  backdrop-filter: blur(6px);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 999px;
  padding: 6px 12px;
  font-weight: 700; font-size: 15px;
  white-space: nowrap;
}
.stat .icon { font-size: 16px; }
.stat .val { letter-spacing: 0.3px; }
#stat-coins .val { color: var(--gold); }
.stat.eco { flex: 1; min-width: 64px; max-width: 220px; overflow: hidden; }
.eco-label { font-size: 12px; opacity: 0.85; white-space: nowrap; }
@media (max-width: 400px) { .eco-label { display: none; } }
/* 手機（直向）一排塞不下時鐘，會把健康度框擠爆、愛心與% 戳出框外。
   ≤480px（涵蓋所有手機）一律收起時鐘，把空間留給健康度條。 */
@media (max-width: 480px) { #stat-clock { display: none; } }
/* 小尺寸手機再進一步縮小頂部資訊列留白 */
@media (max-width: 380px) {
  .stat { padding: 5px 8px; font-size: 13px; gap: 4px; }
  .stat .icon { font-size: 14px; }
}
.eco-bar {
  flex: 1; height: 8px; border-radius: 999px;
  background: rgba(255,255,255,0.15); overflow: hidden;
}
.eco-fill {
  height: 100%; width: 100%;
  background: linear-gradient(90deg, #ff5e6c, #ffcc44, #19c3a6);
  border-radius: 999px;
  transition: width 0.4s ease;
}
#stat-clock { margin-left: auto; }

/* 右上角圖示按鈕 */
.top-btns { display: flex; gap: 6px; pointer-events: auto; }
.icon-btn {
  width: 38px; height: 38px; border-radius: 50%;
  background: rgba(6, 22, 34, 0.7);
  border: 1px solid rgba(255,255,255,0.1);
  backdrop-filter: blur(6px);
  color: #eaf6ff; font-size: 17px; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
}
.icon-btn:active { transform: scale(0.92); }

/* 魚艙滿了的紅色警示 */
.stat.full { border-color: var(--danger); animation: fullBlink 1s ease-in-out infinite; }
.stat.full .val { color: var(--danger); }
@keyframes fullBlink { 50% { background: rgba(255,94,108,0.25); } }

/* ---------- 頂部資訊堆疊：任務 + 委託 垂直排列，永不重疊（直向手機優先） ---------- */
#top-info {
  position: absolute; top: calc(58px + var(--safe-top)); left: 50%;
  transform: translateX(-50%);
  width: min(92vw, 440px);
  display: flex; flex-direction: column; align-items: center; gap: 6px;
  z-index: 12; pointer-events: none;
}

/* ---------- 任務橫幅 ---------- */
#quest-banner {
  background: rgba(6, 22, 34, 0.85);
  border: 1px solid var(--accent);
  border-radius: 12px;
  padding: 8px 16px;
  font-size: 14px; font-weight: 600;
  text-align: center;
  max-width: 100%;
}
#quest-banner b { color: var(--gold); }
.quest-prog {
  height: 8px; border-radius: 5px;
  background: rgba(255,255,255,0.18);
  margin: 7px auto 0; overflow: hidden;
}
.quest-prog-fill {
  height: 100%; border-radius: 5px;
  background: linear-gradient(90deg, #46c0ff, #7ef0a0);
  transition: width 0.3s ease;
}
.quest-prog-num { display: block; font-size: 11px; opacity: 0.85; margin-top: 3px; }

/* ---------- 浮動提示 ---------- */
#toast-layer { position: absolute; inset: 0; pointer-events: none; z-index: 20; }
.toast {
  position: absolute;
  font-weight: 800; font-size: 18px;
  text-shadow: 0 2px 6px rgba(0,0,0,0.6);
  animation: floatUp 1.1s ease-out forwards;
  max-width: 88vw; white-space: normal; text-align: center;
}
.toast.coin { color: var(--gold); }
.toast.eco { color: var(--accent); }
.toast.warn { color: var(--danger); }
@keyframes floatUp {
  0% { opacity: 0; transform: translateY(10px) scale(0.8); }
  20% { opacity: 1; transform: translateY(0) scale(1.1); }
  100% { opacity: 0; transform: translateY(-50px) scale(1); }
}

/* ---------- 底部控制列 ---------- */
#hud-bottom {
  position: absolute; left: 0; right: 0; bottom: 0;
  padding: 10px 14px calc(14px + var(--safe-bottom));
  display: flex; align-items: flex-end; gap: 10px;
  z-index: 10;
}
.center-cluster {
  flex: 1; display: flex; flex-direction: row; flex-wrap: wrap;
  align-items: flex-end; justify-content: center; gap: 8px;
}
/* 釣魚改成「點海面」即可，按鈕不再顯示，避免擋畫面 */
#btnCast { display: none; }
.ctrl {
  border: none; cursor: pointer;
  font-family: inherit; font-weight: 800;
  color: #052;
  transition: transform 0.08s ease, filter 0.1s ease;
  touch-action: manipulation;
}
.ctrl:active { transform: scale(0.92); filter: brightness(0.9); }
.ctrl.move {
  width: 66px; height: 66px; border-radius: 50%;
  font-size: 26px; color: #eaf6ff;
  background: rgba(6, 22, 34, 0.72);
  border: 1px solid rgba(255,255,255,0.12);
  backdrop-filter: blur(6px);
}
.ctrl.action {
  background: linear-gradient(180deg, #2fe0c0, var(--accent-dark));
  color: #04231d; font-size: 19px;
  padding: 14px 30px; border-radius: 999px;
  box-shadow: 0 6px 16px rgba(25,195,166,0.35);
}
.ctrl.action.small {
  font-size: 14px; padding: 9px 16px;
  background: linear-gradient(180deg, #6fb5ff, #2e7fd6);
  color: #021a33;
  box-shadow: 0 4px 12px rgba(46,127,214,0.3);
}
.ctrl.action.small:nth-child(3) {
  background: linear-gradient(180deg, #9be0ff, #4aa6d6);
}
.ctrl:disabled { opacity: 0.4; filter: grayscale(0.6); cursor: not-allowed; }
.center-cluster > .row { display: flex; gap: 8px; }

/* 把兩個小按鈕並排 */
#btnScoop, #btnFilter { min-width: 100px; }

/* ---------- 靠岸提示 ---------- */
#dockHint {
  position: absolute; bottom: calc(150px + var(--safe-bottom)); left: 50%;
  transform: translateX(-50%);
  background: var(--gold); color: #3a2700;
  border: none; border-radius: 999px;
  padding: 12px 22px; font-size: 16px; font-weight: 800;
  cursor: pointer; z-index: 15;
  box-shadow: 0 6px 20px rgba(255,204,68,0.5);
  animation: pulse 1.4s ease-in-out infinite;
}
@keyframes pulse { 50% { transform: translateX(-50%) scale(1.06); } }

/* ---------- 覆蓋層 / 面板 ---------- */
.overlay {
  position: absolute; inset: 0; z-index: 30;
  display: flex; align-items: center; justify-content: center;
  background: rgba(2, 12, 20, 0.78);
  backdrop-filter: blur(4px);
  padding: 16px;
}
.panel {
  background: var(--panel-bg);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 20px;
  width: 100%; max-width: 460px;
  max-height: 88vh; overflow: hidden;
  display: flex; flex-direction: column;
  box-shadow: 0 20px 60px rgba(0,0,0,0.6);
}

/* 開始畫面 */
.panel.start { text-align: center; padding: 28px 24px; }
.panel.start h1 { font-size: 34px; margin-bottom: 2px; }
.panel.start .subtitle { color: var(--accent); letter-spacing: 2px; font-size: 13px; margin-bottom: 18px; }
.panel.start .desc { line-height: 1.7; font-size: 15px; opacity: 0.9; margin-bottom: 18px; }
.start-controls { background: rgba(255,255,255,0.05); border-radius: 12px; padding: 12px; font-size: 13px; line-height: 1.9; margin-bottom: 20px; }
.start-controls b { color: var(--gold); }
.big-btn {
  width: 100%; padding: 16px; border: none; border-radius: 14px;
  background: linear-gradient(180deg, #2fe0c0, var(--accent-dark));
  color: #04231d; font-size: 20px; font-weight: 800; cursor: pointer;
  font-family: inherit;
}
.big-btn:active { transform: scale(0.98); }
.text-btn {
  margin-top: 12px; background: none; border: none;
  color: rgba(255,255,255,0.5); font-size: 13px; cursor: pointer;
  text-decoration: underline; font-family: inherit;
}

/* 商店面板 */
.panel-head {
  display: flex; align-items: center; gap: 12px;
  padding: 16px 18px; border-bottom: 1px solid rgba(255,255,255,0.08);
}
.panel-head h2 { font-size: 20px; }
.panel-coins { margin-left: auto; color: var(--gold); font-weight: 800; font-size: 17px; }
.close {
  width: 34px; height: 34px; border-radius: 50%;
  background: rgba(255,255,255,0.1); border: none; color: #fff;
  font-size: 16px; cursor: pointer;
}
.tabs { display: flex; gap: 6px; padding: 12px 14px 0; }
.tab {
  flex: 1; padding: 10px; border: none; border-radius: 10px 10px 0 0;
  background: rgba(255,255,255,0.05); color: rgba(255,255,255,0.6);
  font-family: inherit; font-weight: 700; font-size: 14px; cursor: pointer;
}
.tab.active { background: rgba(255,255,255,0.12); color: #fff; }
.tab-body { padding: 14px; overflow-y: auto; }

/* 升級項目卡片 */
.item {
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 14px;
  padding: 14px; margin-bottom: 10px;
  display: flex; align-items: center; gap: 12px;
}
.item .item-icon { font-size: 30px; flex-shrink: 0; }
.item .item-main { flex: 1; min-width: 0; }
.item .item-title { font-weight: 800; font-size: 15px; display: flex; align-items: center; gap: 6px; }
.item .item-lvl { font-size: 11px; color: var(--accent); font-weight: 700; }
.item .item-desc { font-size: 12px; opacity: 0.75; margin-top: 3px; line-height: 1.4; }
.item .pips { display: flex; gap: 3px; margin-top: 6px; }
.item .pip { width: 16px; height: 5px; border-radius: 3px; background: rgba(255,255,255,0.15); }
.item .pip.on { background: var(--accent); }
.buy-btn {
  flex-shrink: 0; border: none; border-radius: 10px;
  background: linear-gradient(180deg, #2fe0c0, var(--accent-dark));
  color: #04231d; font-weight: 800; font-size: 14px;
  padding: 10px 14px; cursor: pointer; font-family: inherit;
  min-width: 84px; text-align: center;
}
.buy-btn:disabled { background: rgba(255,255,255,0.12); color: rgba(255,255,255,0.4); cursor: not-allowed; }
.buy-btn.maxed { background: var(--gold); color: #3a2700; }
.buy-btn .price { display: block; font-size: 11px; }

.info-text { font-size: 14px; line-height: 1.8; opacity: 0.9; }
.info-text h3 { margin: 12px 0 4px; font-size: 15px; color: var(--accent); }
.fish-row { display: flex; align-items: center; gap: 10px; padding: 7px 0; border-bottom: 1px solid rgba(255,255,255,0.06); font-size: 14px; }
.fish-row .fdot { width: 16px; height: 16px; border-radius: 50%; flex-shrink: 0; }
.fish-row .fval { margin-left: auto; color: var(--gold); font-weight: 700; }

/* 暫停選單按鈕 */
.pause-panel { max-width: 420px; }
.menu-btn {
  display: block; width: 100%; margin-top: 10px;
  padding: 14px; border: none; border-radius: 12px;
  background: linear-gradient(180deg, #2fe0c0, var(--accent-dark));
  color: #04231d; font-size: 16px; font-weight: 800;
  cursor: pointer; font-family: inherit;
}
.menu-btn:active { transform: scale(0.98); }
.menu-btn.alt { background: rgba(255,255,255,0.12); color: #eaf6ff; }
.menu-btn.danger { background: rgba(255,94,108,0.18); color: #ff9aa4; border: 1px solid rgba(255,94,108,0.3); }
.stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 14px; margin-bottom: 6px; }
.stats-grid .s-row { display: flex; justify-content: space-between; font-size: 14px; padding: 4px 0; border-bottom: 1px solid rgba(255,255,255,0.06); }
.stats-grid .s-row b { color: var(--gold); }

/* 引導教學卡片 */
#tutorial {
  position: absolute; top: calc(64px + var(--safe-top)); left: 50%;
  transform: translateX(-50%);
  width: min(92vw, 440px); z-index: 25;
}
.tut-card {
  background: rgba(8, 26, 38, 0.95);
  border: 2px solid var(--accent);
  border-radius: 16px;
  padding: 14px 16px;
  box-shadow: 0 10px 30px rgba(0,0,0,0.5);
  animation: tutPop 0.25s ease;
}
@keyframes tutPop { from { opacity: 0; transform: translateY(-8px); } }
.tut-card p { font-size: 15px; line-height: 1.6; margin-bottom: 10px; }
.tut-card b { color: var(--gold); }
.tut-actions { display: flex; gap: 8px; justify-content: flex-end; align-items: center; }
.tut-skip {
  background: none; border: none; color: rgba(255,255,255,0.55);
  font-size: 13px; cursor: pointer; font-family: inherit; text-decoration: underline;
}
.tut-next {
  background: linear-gradient(180deg, #2fe0c0, var(--accent-dark));
  color: #04231d; border: none; border-radius: 10px;
  padding: 9px 16px; font-size: 14px; font-weight: 800; cursor: pointer; font-family: inherit;
}
.tut-next:active { transform: scale(0.96); }

/* 手機橫向建議 */
#rotate-hint {
  position: absolute; inset: 0; z-index: 50;
  display: flex; align-items: center; justify-content: center;
  background: rgba(2, 12, 20, 0.92); backdrop-filter: blur(4px);
  padding: 24px; text-align: center;
}
.rotate-box { max-width: 320px; }
.rotate-box p { font-size: 18px; line-height: 1.7; margin: 14px 0 22px; }
.rotate-box b { color: var(--accent); }
.rotate-ico {
  font-size: 64px; display: inline-block;
  animation: rotateTilt 1.6s ease-in-out infinite;
}
@keyframes rotateTilt {
  0%, 100% { transform: rotate(0deg); }
  50% { transform: rotate(90deg); }
}

.hidden { display: none !important; }

/* ---------- 通關結算畫面 ---------- */
.end-panel { max-width: 440px; text-align: center; }
.end-head { font-size: 24px; font-weight: 800; margin: 2px 0 8px; }
.end-story { font-size: 14px; line-height: 1.7; opacity: 0.92; margin-bottom: 12px; }
.end-story b { color: var(--gold); }
.rank-badge { font-size: 64px; font-weight: 900; line-height: 1; margin: 4px 0; }
.rank-badge.rank-S { color: #ffd24a; text-shadow: 0 0 18px rgba(255,210,74,0.6); }
.rank-badge.rank-A { color: #7ef0a0; text-shadow: 0 0 14px rgba(126,240,160,0.4); }
.rank-badge.rank-B { color: #6fb5ff; }
.rank-badge.rank-C { color: #ffb38a; }
.rank-comment { font-size: 14px; margin-bottom: 14px; opacity: 0.95; line-height: 1.6; }
.rank-comment b { color: var(--gold); }
.end-stats {
  display: grid; grid-template-columns: 1fr 1fr; gap: 6px 14px;
  font-size: 13px; text-align: left;
  background: rgba(255,255,255,0.05); border-radius: 10px;
  padding: 10px 12px; margin-bottom: 16px;
}
.end-stats .es-row { display: flex; justify-content: space-between; gap: 8px; }
.end-stats b { color: var(--gold); }
.ec-title { font-size: 15px; color: var(--accent); margin: 4px 0 10px; }
.ec-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); gap: 8px; margin-bottom: 16px; }
.ec-item {
  background: rgba(255,255,255,0.06); border: 1px solid rgba(255,204,68,0.35);
  border-radius: 10px; padding: 8px 4px;
}
.ec-emoji { font-size: 30px; line-height: 1.1; }
.ec-name { font-size: 11px; line-height: 1.3; margin-top: 3px; opacity: 0.9; }
.ec-cnt { font-size: 11px; color: var(--gold); font-weight: 700; margin-top: 2px; }
.ec-empty { font-size: 13px; opacity: 0.7; margin-bottom: 16px; line-height: 1.6; }

/* ---------- 常駐委託需求小卡 ---------- */
#commission-hud {
  max-width: 100%;
  background: rgba(6, 22, 34, 0.82);
  border: 1px solid rgba(255, 204, 68, 0.55);
  border-radius: 12px;
  padding: 7px 12px;
  font-size: 13px; line-height: 1.5;
  text-align: center;
  backdrop-filter: blur(4px);
  pointer-events: none;
}
#commission-hud b { color: var(--gold); }

/* ---------- 開場故事畫面 ---------- */
.story-panel { text-align: center; padding: 22px 20px; }
.story-box {
  position: relative;
  background: linear-gradient(180deg, rgba(8,30,46,0.9), rgba(6,20,32,0.9));
  border: 2px solid var(--accent);
  border-radius: 16px;
  padding: 22px 18px;
  min-height: 190px;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  box-shadow: inset 0 0 30px rgba(25,195,166,0.12);
}
.story-ico { font-size: 52px; margin-bottom: 12px; filter: drop-shadow(0 4px 8px rgba(0,0,0,0.4)); }
.story-text { font-size: 16px; line-height: 1.85; opacity: 0.96; }
.story-text b { color: var(--gold); }
.story-nav { display: flex; align-items: center; justify-content: space-between; gap: 14px; margin: 16px 0 6px; }
.story-arrow {
  width: 46px; height: 46px; border-radius: 50%; flex-shrink: 0;
  background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.18);
  color: #eaf6ff; font-size: 20px; cursor: pointer; font-family: inherit;
}
.story-arrow:active { transform: scale(0.9); }
.story-arrow:disabled { opacity: 0.25; cursor: default; }
.story-dots { display: flex; gap: 7px; }
.story-dots .dot { width: 9px; height: 9px; border-radius: 50%; background: rgba(255,255,255,0.25); transition: background 0.2s; }
.story-dots .dot.on { background: var(--accent); }

/* ---------- 拯救海龜小遊戲 ---------- */
.turtle-panel { max-width: 400px; }
.turtle-art { font-size: 84px; margin: 6px 0 4px; animation: turtleWobble 0.6s ease-in-out infinite; }
@keyframes turtleWobble { 0%,100% { transform: rotate(-6deg); } 50% { transform: rotate(6deg); } }
.turtle-msg { font-size: 15px; line-height: 1.6; margin: 8px 0 14px; }
.turtle-msg b { color: var(--gold); }
.turtle-bar { height: 18px; border-radius: 999px; background: rgba(255,255,255,0.14); overflow: hidden; margin-bottom: 8px; }
.turtle-fill { height: 100%; width: 0%; border-radius: 999px; background: linear-gradient(90deg, #2fe0c0, #7ef0a0); transition: width 0.08s linear; }
.turtle-time { height: 6px; border-radius: 999px; background: rgba(255,255,255,0.1); overflow: hidden; margin-bottom: 16px; }
.turtle-time-fill { height: 100%; width: 100%; background: var(--danger); }
.turtle-tap { font-size: 22px; }
.turtle-tap:active { transform: scale(0.95); filter: brightness(0.92); }

/* ---------- 委託 / 賣垃圾列 ---------- */
.need-list { background: rgba(255,255,255,0.04); border-radius: 10px; padding: 4px 10px; }
.need-row {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: 7px 2px; font-size: 14px; border-bottom: 1px solid rgba(255,255,255,0.06);
}
.need-row:last-child { border-bottom: none; }
.need-row .buy-btn { padding: 7px 10px; font-size: 13px; }

/* ---------- 電腦版：放大畫面、控制鈕移到角落 ---------- */
@media (min-width: 820px) and (pointer: fine) {
  .ctrl.move { width: 58px; height: 58px; }
  #hud-bottom { padding-bottom: 20px; }
  .panel { max-width: 500px; }
}

/* 橫向手機 */
@media (max-height: 480px) {
  .panel.start h1 { font-size: 26px; }

<body>
  <div id="game-root">
    <!-- 遊戲畫布 -->
    <canvas id="game"></canvas>

    <!-- 頂部資訊列 -->
    <header id="hud-top">
      <div class="stat" id="stat-coins">
        <span class="icon">🪙</span><span class="val" id="coins">0</span>
      </div>
      <div class="stat" id="stat-hold">
        <span class="icon">🎒</span><span class="val"><span id="hold">0</span>/<span id="holdMax">10</span></span>
      </div>
      <div class="stat eco" id="stat-eco" title="海洋健康度：越乾淨，魚群越多，代表海域恢復得越好">
        <span class="icon" id="ecoIcon">💚</span>
        <span class="eco-label">海洋</span>
        <div class="eco-bar"><div class="eco-fill" id="ecoFill"></div></div>
        <span class="val" id="ecoVal">100%</span>
      </div>
      <div class="stat" id="stat-clock">
        <span class="icon" id="clockIcon">☀️</span><span class="val" id="clock">06:00</span>
      </div>
      <div class="top-btns">
        <button id="btnSound" class="icon-btn" aria-label="音效">🔊</button>
        <button id="btnPause" class="icon-btn" aria-label="暫停">⏸</button>
      </div>
    </header>

    <!-- 頂部資訊堆疊：任務 + 委託 垂直排列，避免在直向手機上重疊 -->
    <div id="top-info">
      <!-- 任務提示 -->
      <div id="quest-banner" class="hidden"></div>
      <!-- 常駐委託需求小卡（隨時看得到還缺哪些垃圾） -->
      <div id="commission-hud" class="hidden"></div>

    <!-- 浮動提示文字 (賺錢/事件) -->

    <!-- 底部控制列 -->
    <footer id="hud-bottom">
      <button class="ctrl move" id="btnLeft" aria-label="向左">◀</button>
      <div class="center-cluster">
        <button class="ctrl action" id="btnCast">🎣 釣垃圾</button>
        <button class="ctrl action small" id="btnScoop" disabled>🗑️ 撈垃圾</button>
        <button class="ctrl action small" id="btnFilter" disabled>💧 淨化</button>
      </div>
      <button class="ctrl move" id="btnRight">▶</button>
    </footer>

    <!-- 靠岸時的商店按鈕 -->
    <button id="dockHint" class="hidden">🏪 靠岸了！點此進入</button>

    <!-- 商店 / 升級面板（標題與內容依靠岸的建築動態切換） -->
    <div id="shop-overlay" class="overlay hidden">
      <div class="panel shop">
        <div class="panel-head">
          <h2 id="shopTitle">🏪 商店</h2>
          <div class="panel-coins">🪙 <span id="shopCoins">0</span></div>
          <button class="close" id="shopClose">✕</button>
        </div>
        <div class="tab-body" id="shopBody"></div>
      </div>
    </div>

    <!-- 拯救海龜小遊戲 -->
    <div id="turtle-overlay" class="overlay hidden">
      <div class="panel turtle-panel">
        <div class="panel-head">
          <h2 id="turtleTitle">🐢 受困海龜！</h2>
        </div>
        <div class="tab-body" style="text-align:center;">
          <div id="turtleArt" class="turtle-art">🐢</div>
          <p class="turtle-msg" id="turtleMsg">海龜被<b>塑膠袋</b>纏住了！<br/><b>快速連點下方按鈕</b>幫牠掙脫！</p>
          <div class="turtle-bar"><div class="turtle-fill" id="turtleFill"></div></div>
          <div class="turtle-time"><div class="turtle-time-fill" id="turtleTime"></div></div>
          <button id="turtleTap" class="big-btn turtle-tap">👆 用力拉！</button>
        </div>
      </div>
    </div>

    <!-- 引導教學卡片 -->
    <div id="tutorial" class="hidden">
      <div class="tut-card">
        <p id="tutText"></p>
        <div class="tut-actions">
          <button id="tutSkip" class="tut-skip">跳過</button>
          <button id="tutNext" class="tut-next">下一步 ▶</button>
        </div>
      </div>
    </div>

    <!-- 手機橫向建議 -->
    <div id="rotate-hint" class="hidden">
      <div class="rotate-box">
        <div class="rotate-ico">📱</div>
        <p>建議將手機<b>橫向</b>擺放，<br/>遊玩體驗更好！</p>
        <button id="rotateDismiss" class="big-btn">知道了，直向也能玩</button>
      </div>
    </div>

    <!-- 暫停選單 -->
    <div id="pause-overlay" class="overlay hidden">
      <div class="panel pause-panel">
        <div class="panel-head">
          <h2>⏸ 暫停</h2>
          <button class="close" id="pauseClose">✕</button>
        </div>
        <div class="tab-body">
          <div id="statsBox" class="info-text"></div>
          <button class="menu-btn" id="btnResume">▶ 繼續遊戲</button>
          <button class="menu-btn alt" id="btnTutorial">📖 重看教學</button>
          <button class="menu-btn alt" id="btnSound2">🔊 音效：開</button>
          <button class="menu-btn danger" id="btnReset2">🗑️ 清除存檔重新開始</button>
        </div>
      </div>
    </div>

    <!-- 通關結算畫面（考核評等 + 海廢文創成果展） -->
    <div id="end-overlay" class="overlay hidden">
      <div class="panel end-panel">
        <div class="tab-body" id="endBody"></div>
      </div>
    </div>

    <!-- 開場故事畫面（方框 + ◀▶ 翻頁） -->
    <div id="start-overlay" class="overlay">
      <div class="panel start story-panel">
        <div class="story-box">
          <div class="story-ico" id="storyIco">📋</div>
          <p class="story-text" id="storyText"></p>
        </div>
        <div class="story-nav">
          <button id="storyPrev" class="story-arrow" aria-label="上一頁">◀</button>
          <div class="story-dots" id="storyDots"></div>
          <button id="storyNext" class="story-arrow" aria-label="下一頁">▶</button>
        </div>
        <button id="btnStart" class="big-btn hidden">⚓ 上任，開始任務</button>
        <button id="btnReset" class="text-btn">清除存檔重新開始</button>
      </div>
    </div>
  </div>

  <script>
/* ============================================================
   淨海稽查員 Ocean Cleanup Inspector
   純 JavaScript + Canvas 2D。世界座標水平捲動，攝影機跟著船。
   你是被下放東部海岸的環保署稽查員，要釣起海洋垃圾、接文創委託、
   買淨化設備清除塑膠微粒、拯救受困海龜，讓海洋與漁民生計恢復。
   ============================================================ */
(() => {
'use strict';

// ---------- 基本設定 ----------
const WORLD_W = 3000;          // 海洋世界總寬度
const HARBOR_X = WORLD_W - 360; // 海岸線（三棟建築所在帶狀區）起點
const DAY_LEN = 150;           // 一天 = 150 秒
const SAVE_KEY = 'oceanInspector.save.v1';

// ---------- 海岸三棟建築 ----------
// 玩家把船開到建築附近即可進入；各建築功能不同
const SHOPS = {
  recycler: { name:'回收商',       icon:'🛠️', x: WORLD_W - 470 }, // 升級船 / 釣竿 / 背包 / 雷達
  micropc:  { name:'點點塑',       icon:'🏭', x: WORLD_W - 300 }, // 購買淨化機 / 撈取機
  artshop:  { name:'海廢文創小舖', icon:'🎨', x: WORLD_W - 130 }, // 接委託 + 賤價賣多餘垃圾
};
const DOCK_X = SHOPS.artshop.x;   // 船可航行到的最右界（最右邊那棟）
const SHOP_R = 95;                // 靠岸判定半徑

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');

let view = { w: 0, h: 0, dpr: 1 };
let seaY = 0;        // 海平面在螢幕上的基準高度
let running = false;
let lastT = 0;
let time = 6 * 60 * 60 / (24*60*60) * DAY_LEN; // 從早上6點開始(秒)

// ---------- 升級定義（在「回收商」購買）----------
const DEFS = {
  rod:    { name:'釣竿',           icon:'🎣', cat:'upgrade', lvl:1, min:1, max:6, base:30,  mul:1.7 },
  speed:  { name:'船用引擎',       icon:'⚙️', cat:'upgrade', lvl:1, min:1, max:6, base:25,  mul:1.6 },
  hold:   { name:'背包',           icon:'🎒', cat:'upgrade', lvl:1, min:1, max:6, base:35,  mul:1.7 },
  sonar:  { name:'垃圾雷達',       icon:'📡', cat:'upgrade', lvl:0, min:0, max:3, base:120, mul:2.0 },
};
const depthFor  = l => 130 + (l - 1) * 70;     // 釣線可達深度(螢幕px)
const holdFor   = l => 8 + (l - 1) * 6;        // 背包容量（可裝幾件垃圾）
const speedMul  = l => 1 + (l - 1) * 0.45;     // 船速倍率（每級 +45%，升級更有感）
const descOf = {
  rod:   l => `釣線深度等級 ${l}，能撈到更深處的垃圾`,
  speed: l => `船速 +${Math.round((speedMul(l)-1)*100)}%`,
  hold:  l => `背包可裝 ${holdFor(l)} 件垃圾`,
  sonar: l => l>0 ? `賣垃圾/委託金 +${l*8}%，並顯示海面垃圾與海龜位置` : '安裝後顯示垃圾與海龜位置，並提升收入',
};

// ---------- 環保機器（購買後放置定點、自動運作；可收回重放） ----------
const MACHINE = {
  scoop:  { name:'海洋垃圾撈取機', icon:'🗑️', price:80,  range:155, cd:0.7,    cap:5, life:30 },
  filter: { name:'塑膠微粒過濾機', icon:'💧', price:120, range:170, rate:0.018, cap:5, life:30 },
};
// 擁有總數 = 全新庫存 + 收回保留的半舊機(spares) + 已放置在海上的
function machineOwned(type){
  return state.inv[type] + state.spares[type].length + state.placed.filter(p=>p.type===type).length;
}
// 可立即放置的數量（全新 + 半舊收回的）
function machineAvail(type){ return state.inv[type] + state.spares[type].length; }
// 污染擴張參數（緩慢）：未淨化海域會慢慢變寬、濃度也微幅回升；
// 但淨化機速度（0.018/秒）遠快於回升，且已淨化(p≈0)的海域不會再擴張，仍可穩定全清通關
const POLLUTION_EXPAND = 0.7;    // px/秒（每側）— 非常緩慢地變寬
const POLLUTION_CREEP  = 0.0005; // 濃度/秒 — 極微幅回升（淨化機快 36 倍，清理時穩定下降）
// 「已淨化」門檻：濃度低於此值就視為完全乾淨（畫面也不再畫污染），讓「看起來乾淨」＝「任務算乾淨」
const CLEAN_P = 0.04;

// ---------- 魚種（純裝飾：海洋越乾淨魚越多，不能釣，只作健康指標）----------
const FISH_TYPES = [
  { key:'sardine', name:'沙丁魚', emoji:'🐟', color:'#9fd3e8', value:8,   dMinF:0.05, dMaxF:0.30, w:5,  night:0, shape:'fish',   size:0.8 },
  { key:'bream',   name:'真鯛',   emoji:'🐠', color:'#ff9a6c', value:22,  dMinF:0.25, dMaxF:0.58, w:4,  night:0, shape:'bream',  size:1.0 },
  { key:'tuna',    name:'鮪魚',   emoji:'🐟', color:'#4a78b5', value:55,  dMinF:0.40, dMaxF:0.68, w:2.4,night:0, shape:'tuna',   size:1.5 },
  { key:'puffer',  name:'河豚',   emoji:'🐡', color:'#f2c14e', value:38,  dMinF:0.30, dMaxF:0.64, w:2,  night:0, shape:'puffer', size:1.0 },
  { key:'squid',   name:'魷魚',   emoji:'🦑', color:'#e7a6c4', value:70,  dMinF:0.40, dMaxF:0.82, w:2,  night:1, shape:'squid',  size:1.0 },
  { key:'shrimp',  name:'甜蝦',   emoji:'🦐', color:'#ff8e7a', value:30,  dMinF:0.80, dMaxF:0.93, w:3,  night:0, shape:'shrimp', size:0.85 },
];

// ---------- 海洋垃圾型別（用釣竿撈起，可做委託材料或賤價賣掉）----------
const TRASH_TYPES = [
  { key:'bottle',  name:'寶特瓶', emoji:'🥤', sell:2, w:5 },
  { key:'bag',     name:'塑膠袋', emoji:'🛍️', sell:1, w:5 },
  { key:'jug',     name:'塑膠瓶', emoji:'🧴', sell:2, w:4 },
  { key:'can',     name:'鋁罐',   emoji:'🥫', sell:2, w:4 },
  { key:'foam',    name:'保麗龍', emoji:'📦', sell:1, w:3 },
  { key:'slipper', name:'廢拖鞋', emoji:'🩴', sell:3, w:2 },
];
const TRASH_BY_KEY = Object.fromEntries(TRASH_TYPES.map(t => [t.key, t]));
function pickTrashType(){
  const total = TRASH_TYPES.reduce((a,t)=>a+t.w,0);
  let r = Math.random()*total;
  for (const t of TRASH_TYPES){ if ((r -= t.w) <= 0) return t; }
  return TRASH_TYPES[0];
}

// ---------- 海廢文創委託（在「海廢文創小舖」接單）----------
// need：需要的垃圾型別與數量；reward：完成獎金
const COMMISSIONS = [
  { title:'寶特瓶小盆栽', emoji:'🪴', need:{ bottle:3 },            reward:55  },
  { title:'塑膠袋編織提袋', emoji:'👜', need:{ bag:4 },              reward:70  },
  { title:'鋁罐療癒風鈴',  emoji:'🎐', need:{ can:3, bottle:1 },     reward:85  },
  { title:'海廢拼貼畫',    emoji:'🖼️', need:{ foam:2, bag:2, slipper:1 }, reward:115 },
  { title:'回收瓶鑰匙圈',  emoji:'🔑', need:{ jug:3, can:1 },        reward:95  },
  { title:'廢拖鞋小玩偶',  emoji:'🧸', need:{ slipper:2, bag:1 },    reward:90  },
];

// ---------- 遊戲狀態 ----------
let state;
function freshState() {
  return {
    coins: 0,
    up: { rod:1, speed:1, hold:1, sonar:0 },
    inv: { scoop:0, filter:0 },   // 已購買、尚未放置的全新機器數量
    spares: { scoop:[], filter:[] }, // 收回的半舊機器（保留剩餘耐久，避免放回即回滿）
    placed: [],                   // 已放置在海上的機器 {type, worldX, cd, life}
    boat: { x: 400, vx: 0, dir: 1 },
    hold: [],                 // 背包內的垃圾 {key, emoji, name}
    fish: [],
    trash: [],
    turtle: null,             // 受困海龜事件 {worldX, depth, vx, ph, hideT}
    zones: [                  // 污染海域 (世界座標) — 4 區，集中在港口左側
      { x0: 460,  x1: 760,  p: 0.85 },
      { x0: 1020, x1: 1320, p: 0.95 },
      { x0: 1560, x1: 1860, p: 1.0  },
      { x0: 2060, x1: 2340, p: 0.90 },
    ],
    eco: 55,                  // 海洋健康度 0~100 (平滑值)
    line: { active:false, phase:'idle', depth:0, caught:null },
    commissionIdx: 0,         // 目前文創委託編號（循環）
    commissionProgress: {},   // 目前委託「已先繳交」的材料數 {key:已交數}
    commDone: {},             // 已完成的文創委託 {委託index: 完成次數} — 給結算「成果展」用
    stats: { caught:0, delivered:0, commissions:0, trash:0, cleaned:0, earned:0, rescued:0 },
    questIdx: 0,
    time: time,
    day: 1,
    muted: false,
    tutDone: false,
  };
}

// ---------- 不需存檔的執行期狀態 ----------
let paused = false;
let questPollT = 0;   // 任務自動巡檢計時：讓被動達成（如健康度回升）的任務也能即時更新
let combo = 0, comboTimer = 0;
let animClock = 0;    // 連續累加的動畫時鐘（給海浪等視覺用，永不歸零）
let fx = [];          // 特效粒子（水花、收線星光）
let allCleanCelebrated = false;  // 是否已慶祝過全海域淨化
let tutStep = -1;     // 目前教學步驟 (-1 = 未進行)
let tutBase = 0;      // 自動推進步驟的基準值
let rotateDismissed = false;  // 是否已關閉橫向提示
let turtleSpawnT = 25; // 距離下一隻受困海龜出現的倒數（秒）
let rescue = null;    // 拯救海龜小遊戲狀態 {taps, need, time, max}
let storyPage = 0;    // 開場故事目前頁碼

// ---------- 任務 ----------
const allZonesClean = s => s.zones.every(z => z.p <= CLEAN_P);
const cleanedZones  = s => s.zones.filter(z => z.p <= CLEAN_P).length;
// 每個任務都有 prog:s=>[目前, 目標]，用來畫進度條
const QUESTS = [
  { text:'點海面，用釣竿釣起 3 件海洋垃圾',  done:s=>s.stats.caught>=3,  prog:s=>[s.stats.caught,3],   reward:30 },
  { text:'到右邊「🎨海廢文創小舖」完成第 1 筆委託', done:s=>s.stats.commissions>=1, prog:s=>[s.stats.commissions,1], reward:50 },
  { text:'到「🛠️回收商」把背包或釣竿升級一次',  done:s=>s.up.rod>=2||s.up.hold>=2, prog:s=>[(s.up.rod>=2||s.up.hold>=2)?1:0,1], reward:50 },
  { text:'到「🏭點點塑」購買「淨化機」放進污染區', done:s=>machineOwned('filter')>0 || allZonesClean(s), prog:s=>[machineOwned('filter'),1], reward:100 },
  { text:'淨化一個深色污染海域',        done:s=>s.stats.cleaned>=1 || allZonesClean(s), prog:s=>[Math.max(s.stats.cleaned,cleanedZones(s)),1], reward:120 },
  { text:'拯救 1 隻被塑膠袋纏住的海龜或水母', done:s=>s.stats.rescued>=1, prog:s=>[s.stats.rescued,1], reward:80 },
  { text:'累計完成 3 筆文創委託',       done:s=>s.stats.commissions>=3, prog:s=>[s.stats.commissions,3], reward:120 },
  { text:'累積總收入達到 400 元',       done:s=>s.stats.earned>=400, prog:s=>[Math.floor(s.stats.earned),400], reward:120 },
  { text:'淨化 2 個污染海域',           done:s=>s.stats.cleaned>=2 || allZonesClean(s), prog:s=>[Math.max(s.stats.cleaned,cleanedZones(s)),2], reward:200 },
  { text:'讓海洋健康度回升到 70%',      done:s=>s.eco>=70,          prog:s=>[Math.round(s.eco),70], reward:150 },
  { text:'最終目標：淨化全部 4 個污染海域，立功調回台北！', done:s=>allZonesClean(s), prog:s=>[cleanedZones(s),s.zones.length], reward:300 },
];

// ---------- 引導教學步驟 ----------
const TUT = [
  { text:'歡迎來到《淨海稽查員》！你是被下放到東部海岸的<b>環保署稽查員</b>，任務是清乾淨海洋、幫漁民找回生計，立功調回台北！', manual:true },
  { text:'先學移動：按住左下 ◀ 或右下 ▶ 開船（電腦可用 A／D 或方向鍵）。試著移動看看！', enter:s=>tutBase=s.boat.x, auto:s=>Math.abs(s.boat.x - tutBase) > 80 },
  { text:'釣垃圾：直接<b>點海面</b>任意處（電腦可按空白鍵）放下釣竿，把<b>海洋垃圾</b>撈起來收進背包。試著釣一件！', enter:s=>tutBase=s.stats.caught, auto:s=>s.stats.caught > tutBase },
  { text:'換錢：把船開到<b>最右邊海岸</b>的三棟建築。靠近<b>🎨海廢文創小舖</b>，點金色按鈕進入，<b>完成委託</b>賺大錢；抓錯的垃圾也能在這裡<b>賤價賣掉</b>清背包。', manual:true },

function startTutorial(){ tutStep = 0; tutEnter(); }
function tutEnter(){
  const step = TUT[tutStep];
  if (!step) { tutEnd(); return; }
  if (step.enter) step.enter(state);
  const el = document.getElementById('tutorial');
  el.classList.remove('hidden');
  document.getElementById('tutText').innerHTML = step.text;
  const nextBtn = document.getElementById('tutNext');
  nextBtn.classList.toggle('hidden', !step.manual);   // 自動步驟不顯示「下一步」
  nextBtn.textContent = step.last ? '開始遊玩 ✓' : '下一步 ▶';
  showQuest();
}
function tutNext(){ tutStep++; tutEnter(); }
function tutEnd(){
  tutStep = -1;
  document.getElementById('tutorial').classList.add('hidden');
  if (state) { state.tutDone = true; save(); }
  showQuest();
}
function tutCheck(){   // 每幀檢查自動推進步驟
  if (tutStep < 0) return;
  const step = TUT[tutStep];
  if (step && step.auto && step.auto(state)) { tutStep++; tutEnter(); }
}

function save() {
  try {
    const data = {
      coins: state.coins, up: state.up, eco: state.eco,
      inv: state.inv, spares: state.spares, placed: state.placed,
      zones: state.zones, stats: state.stats, questIdx: state.questIdx,
      commissionIdx: state.commissionIdx, commissionProgress: state.commissionProgress, commDone: state.commDone,
      boatX: state.boat.x, time: state.time, day: state.day, muted: state.muted, tutDone: state.tutDone,
    };
    localStorage.setItem(SAVE_KEY, JSON.stringify(data));
  } catch (e) {}
}
function load() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return false;
    const d = JSON.parse(raw);
    state = freshState();
    state.coins = d.coins ?? 0;
    state.up = Object.assign(state.up, d.up || {});
    state.eco = d.eco ?? 55;
    // 機器（含舊存檔遷移：舊版買斷的機器轉成 1 台庫存）
    state.inv = { scoop:0, filter:0 };
    if (d.inv) state.inv = Object.assign(state.inv, d.inv);
    else { if (d.up && d.up.scoop>0) state.inv.scoop=1; if (d.up && d.up.filter>0) state.inv.filter=1; }
    // 收回保留的半舊機器
    state.spares = { scoop:[], filter:[] };
    if (d.spares) {
      if (Array.isArray(d.spares.scoop))  state.spares.scoop  = d.spares.scoop.filter(v=>typeof v==='number');
      if (Array.isArray(d.spares.filter)) state.spares.filter = d.spares.filter.filter(v=>typeof v==='number');
    }
    // 已放置機器：補齊耐久欄位（舊存檔沒有 life → 給滿耐久，避免 NaN）
    state.placed = (Array.isArray(d.placed) ? d.placed : [])
      .filter(p => p && MACHINE[p.type])
      .map(p => ({
        type: p.type,
        worldX: p.worldX,
        cd: typeof p.cd === 'number' ? p.cd : 0,
        life: typeof p.life === 'number' ? p.life : MACHINE[p.type].life,
      }));
    if (d.zones) state.zones = d.zones;
    // 防呆：舊存檔的污染區座標若超出目前世界範圍，重建一份
    if (state.zones.some(z => z.x1 > DOCK_X - 200)) state.zones = freshState().zones;
    if (d.stats) state.stats = Object.assign(state.stats, d.stats);
    state.commissionIdx = d.commissionIdx ?? 0;
    state.commissionProgress = (d.commissionProgress && typeof d.commissionProgress==='object') ? d.commissionProgress : {};
    state.commDone = (d.commDone && typeof d.commDone==='object') ? d.commDone : {};
    state.questIdx = d.questIdx ?? 0;
    state.boat.x = d.boatX ?? 400;
    state.time = d.time ?? time;
    state.day = d.day ?? 1;
    state.muted = d.muted ?? false;
    state.tutDone = d.tutDone ?? false;
    // 同步升級定義等級
    for (const k in DEFS) DEFS[k].lvl = state.up[k];
    return true;
  } catch (e) { return false; }
}
function syncDefs() { for (const k in DEFS) DEFS[k].lvl = state.up[k]; }

// ============================================================
//  音效 (Web Audio 合成，無需音檔)
// ============================================================
let audioCtx = null;
function initAudio() {
  try {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
  } catch (_) {}
}
function beep(freq, dur, type, vol, delay) {
  if (!audioCtx || state.muted) return;
  const t0 = audioCtx.currentTime + (delay || 0);
  const o = audioCtx.createOscillator(), g = audioCtx.createGain();
  o.type = type || 'sine';
  o.frequency.setValueAtTime(freq, t0);
  g.gain.setValueAtTime(0.0001, t0);
  g.gain.linearRampToValueAtTime(vol || 0.18, t0 + 0.01);
  g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(audioCtx.destination);
  o.start(t0); o.stop(t0 + dur + 0.02);
}
function sfx(name) {
  if (state.muted || !audioCtx) return;
  switch (name) {
    case 'cast':  beep(330, 0.12, 'sine', 0.12); break;
    case 'catch': beep(523, 0.10, 'triangle', 0.18); beep(784, 0.12, 'triangle', 0.18, 0.08); break;
    case 'sell':  beep(659, 0.10, 'square', 0.12); beep(880, 0.10, 'square', 0.12, 0.09); beep(1047, 0.14, 'square', 0.12, 0.18); break;
    case 'buy':   beep(440, 0.08, 'sine', 0.16); beep(660, 0.10, 'sine', 0.16, 0.07); break;
    case 'clean': beep(700, 0.16, 'sine', 0.10); beep(1000, 0.18, 'sine', 0.10, 0.1); beep(1320, 0.22, 'sine', 0.10, 0.2); break;
    case 'trash': beep(280, 0.07, 'square', 0.10); break;
    case 'error': beep(150, 0.18, 'sawtooth', 0.12); break;
  }
}

function resize() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2);
  view.w = window.innerWidth;
  view.h = window.innerHeight;
  view.dpr = dpr;
  canvas.width = Math.floor(view.w * dpr);

  canvas.style.height = view.h + 'px';

  // 導致底部左右按鈕被工具列擋住看不到（所有手機瀏覽器通用的保險做法）

// ============================================================
//  海浪 / 海面
// ============================================================
function surfaceY(worldX, t) {
  // 用連續累加的 animClock 當波形相位（不用會每天 %DAY_LEN 歸零的 state.time），
  // 避免每隔一天海浪相位瞬間跳掉、整片海面「回溯」一下
  const a = animClock;
  return seaY
    + Math.sin(worldX * 0.0090 + a * 1.10) * 7
    + Math.sin(worldX * 0.0260 + a * 1.70) * 4
    + Math.sin(worldX * 0.0045 - a * 0.65) * 11;
}
function pollutionAt(worldX) {
  let p = 0;
  for (const z of state.zones) if (worldX >= z.x0 && worldX <= z.x1) p = Math.max(p, z.p);
  return p;
}

// 沙灘與可用水深（魚與釣鉤都不可低於沙灘）
function seabedTop()  { return view.h - 46; }
function waterBottom(){ return seabedTop() - 14; }                 // 魚最深只能到這（沙灘上方）
function columnH()    { return Math.max(60, waterBottom() - seaY); } // 海面到沙灘上緣的可用高度
function rodReach(l)  { return columnH() * Math.min(0.98, 0.30 + (l - 1) * 0.135); } // 釣線可達深度(px)
function fishScreenY(f, t) {
  return Math.min(surfaceY(f.worldX, t) + f.depth + Math.sin(f.ph) * 3, waterBottom());
}
function trashScreenY(tr, t) {
  return Math.min(surfaceY(tr.worldX, t) + (tr.depth || 6) + Math.sin(tr.ph) * 3, waterBottom());
}

// ============================================================
//  特效粒子
// ============================================================
function addRipple(worldX, y) {
  fx.push({ type:'ripple', x:worldX, y, t:0 });
  if (fx.length > 60) fx.shift();
}
function addSparkle(worldX, y) {
  for (let i=0;i<7;i++) fx.push({ type:'spark', x:worldX, y, vx:(Math.random()-0.5)*70, vy:-40-Math.random()*40, t:0, life:0.6 });
  if (fx.length > 90) fx.splice(0, fx.length-90);
}
function updateFx(dt) {
  for (let i=fx.length-1;i>=0;i--){
    const p=fx[i]; p.t+=dt;
    if (p.type==='ripple'){ if(p.t>0.6) fx.splice(i,1); }
    else { p.x+=p.vx*dt; p.vy+=140*dt; p.y+=p.vy*dt; if(p.t>p.life) fx.splice(i,1); }
  }
}
function drawFx(c) {
  for (const p of fx){
    const x=p.x-c; if(x<-30||x>view.w+30) continue;
    if (p.type==='ripple'){
      const r=4+p.t*46, a=Math.max(0,0.5*(1-p.t/0.6));
      ctx.strokeStyle=`rgba(255,255,255,${a})`; ctx.lineWidth=2;
      ctx.beginPath(); ctx.ellipse(x,p.y,r,r*0.32,0,0,7); ctx.stroke();
    } else {
      const a=Math.max(0,1-p.t/p.life);
      ctx.fillStyle=`rgba(255,255,210,${a})`;
      ctx.beginPath(); ctx.arc(x,p.y,2,0,7); ctx.fill();
    }
  }
}

// ============================================================
//  生成魚 / 垃圾
// ============================================================
function isNight() { const h = (state.time / DAY_LEN) * 24; return h < 5.5 || h > 18.5; }

function spawnFish(forceX) {
  const night = isNight();
  // 依機率挑魚種
  const pool = FISH_TYPES.filter(f => f.night === 0 || night);
  let total = pool.reduce((a,f)=>a+f.w,0), r = Math.random()*total, t = pool[0];
  for (const f of pool) { if ((r -= f.w) <= 0) { t = f; break; } }
  // 魚是「海洋乾不乾淨」的指標：避免生在污染區（找乾淨的水域）
  let x = forceX;
  if (x == null) {
    x = 200 + Math.random()*(SHOPS.recycler.x-400);
    for (let tries=0; tries<6 && pollutionAt(x)>0.3; tries++) x = 200 + Math.random()*(SHOPS.recycler.x-400);
  }
  const depth = (t.dMinF + Math.random()*(t.dMaxF - t.dMinF)) * columnH();
  state.fish.push({
    t, worldX:x, depth,
    vx:(Math.random()<0.5?-1:1)*(12+Math.random()*22),
    ph: Math.random()*Math.PI*2,
  });
}
function spawnTrash(forceX) {
  let x = forceX ?? (200 + Math.random()*(SHOPS.recycler.x-450));
  const ty = pickTrashType();
  state.trash.push({
    worldX:x, key:ty.key, emoji:ty.emoji, name:ty.name,
    depth: 6 + Math.pow(Math.random(),1.5)*(columnH()*0.8),   // 垃圾分布在不同深度（越深越需要好釣竿）
    ph: Math.random()*Math.PI*2, drift:(Math.random()-0.5)*8,
  });
}

// 放置 / 收回機器
function toggleMachine(type) {
  if (!running || shopOpen() || paused) return;
  const R = 70;
  const idx = state.placed.findIndex(p => p.type===type && Math.abs(p.worldX-state.boat.x)<R);
  const sx = state.boat.x - cam(), sy = surfaceY(state.boat.x, state.time) - 26;
  if (idx >= 0) {                                   // 附近有自己的機器 → 收回（保留剩餘耐久）
    const m = state.placed.splice(idx,1)[0];
    state.spares[type].push(Math.max(0, m.life));
    const pct = Math.round(Math.max(0,m.life)/MACHINE[type].life*100);
    toast(sx, sy, `🔧 收回機器（耐久 ${pct}%）`, 'eco'); sfx('buy');
  } else if (state.spares[type].length > 0) {       // 放一台半舊的（用回先前剩餘耐久）
    const life = state.spares[type].pop();
    state.placed.push({ type, worldX: state.boat.x, cd: 0, life });
    toast(sx, sy, (type==='filter'?'💧 放置淨化機':'🗑️ 放置撈取機'), 'eco'); sfx('buy');
  } else if (state.inv[type] > 0) {                 // 放一台全新的（滿耐久）
    state.inv[type]--;
    state.placed.push({ type, worldX: state.boat.x, cd: 0, life: MACHINE[type].life });
    toast(sx, sy, (type==='filter'?'💧 放置淨化機':'🗑️ 放置撈取機'), 'eco'); sfx('buy');
  } else {
    toast(view.w/2, view.h*0.55, '沒有可放置的機器，去漁港商店購買', 'warn'); sfx('error');
  }
  updateMachineBtns(); save();
}

canvas.addEventListener('pointerdown', e => {
