function cast() {
  if (!running || shopOpen() || rescue) return;
  if (state.line.active) return;
  const shop = nearShop();
  if (shop) { openShop(shop); return; }
  if (state.hold.length >= holdFor(state.up.hold)) {
    toast(view.w/2, view.h*0.55, '背包滿了！去海岸把垃圾交委託或賣掉 ▶', 'warn'); sfx('error'); return;
  }
  state.line = { active:true, phase:'down', depth:0, caught:null };
  sfx('cast');
  addRipple(state.boat.x, surfaceY(state.boat.x, state.time));
}

// ============================================================
//  更新
// ============================================================
function update(dt) {
  // 時間 / 日夜 / 天數
  const prevTime = state.time;
  state.time = (state.time + dt) % DAY_LEN;
  if (state.time < prevTime) state.day++;   // 跨過午夜 → 新的一天
  animClock += dt;                          // 視覺動畫用，連續不歸零（海浪相位不跳）

  // Combo 連釣計時
  if (comboTimer > 0) { comboTimer -= dt; if (comboTimer <= 0) combo = 0; }

  // 引導教學自動推進
  tutCheck();

  // 螃蟹被釣走後的重生計時
  for (const cb of SEABED.crabs) if (cb.hideT > 0) cb.hideT -= dt;

  // 特效
  updateFx(dt);

  // 船移動
  const acc = 1050, max = 290 * speedMul(state.up.speed);
  let dir = 0;
  if (keys.left) dir -= 1;
  if (keys.right) dir += 1;
  state.boat.vx += dir * acc * dt;
  state.boat.vx *= Math.pow(0.0008, dt);  // 阻力
  if (dir===0 && Math.abs(state.boat.vx)<4) state.boat.vx=0;
  state.boat.vx = Math.max(-max, Math.min(max, state.boat.vx));
  state.boat.x += state.boat.vx * dt;
  state.boat.x = Math.max(120, Math.min(DOCK_X, state.boat.x));
  if (dir!==0) state.boat.dir = dir;

  // 釣線
  updateLine(dt);

  // 魚群數量＝海洋健康度的指標：一開始（髒）非常稀少，越乾淨魚越多
  const eFrac = Math.max(0, Math.min(1, state.eco/100));
  const target = Math.round(1 + Math.pow(eFrac, 2.5) * 48);  // eco 40%→約6、70%→約21、100%→49（越乾淨魚越多）
  while (state.fish.length < target) spawnFish();
  for (let i=state.fish.length-1;i>=0;i--){
    const f = state.fish[i];
    f.worldX += f.vx * dt;
    f.ph += dt*3;
    // 往前看一段距離，在世界邊界或港口前轉頭（魚停留在開闊海域，不游進建築區）
    const ahead = f.worldX + Math.sign(f.vx) * 22;
    if (ahead < 150 || ahead > SHOPS.recycler.x-180) f.vx = -f.vx;
    if (f.worldX<120||f.worldX>SHOPS.recycler.x-120){ state.fish.splice(i,1); }
  }
  // 海洋變髒（target 下降）時，逐步把多餘的魚移除，讓魚數忠實反映健康度
  if (state.fish.length>target+6) state.fish.splice(0, state.fish.length-target);

  // 漂浮垃圾量＝跟著污染走：海越髒垃圾越多，全部淨化後不再產生
  const dirtyZones = state.zones.filter(z => z.p > 0.05);
  const pollutionAmt = dirtyZones.reduce((a,z)=>a+z.p*(z.x1-z.x0), 0);
  const trashTarget = dirtyZones.length ? Math.max(6, Math.round(pollutionAmt/70)) : 0;
  if (state.trash.length < trashTarget && Math.random()<0.7) {
    if (dirtyZones.length && Math.random()<0.55) {   // 約一半偏好生在污染區附近，其餘散佈整片海域
      const z = dirtyZones[(Math.random()*dirtyZones.length)|0];
      spawnTrash(z.x0 + Math.random()*(z.x1-z.x0));
    } else {
      spawnTrash();
    }
  }
  // 海洋變乾淨（target 下降）→ 把畫面外多餘的垃圾逐步移除，避免玩家看到憑空消失
  if (state.trash.length > trashTarget) {
    const cx = cam();
    for (let i=state.trash.length-1; i>=0 && state.trash.length>trashTarget; i--){
      const sx = state.trash[i].worldX - cx;
      if (sx < -80 || sx > view.w+80) state.trash.splice(i,1);
    }
  }
  for (const tr of state.trash){ tr.ph += dt*1.5; tr.worldX += tr.drift*dt; }

  // 受困海龜事件
  updateTurtle(dt);

  // 已放置的環保機器（自動運作；耐久耗盡會損壞消失）
  for (let mi = state.placed.length - 1; mi >= 0; mi--) {
    const m = state.placed[mi];
    m.life -= dt;
    if (m.life <= 0) {                         // 耐久耗盡 → 報廢消失（不退回庫存）
      const sx = m.worldX - cam();
      toast(sx, surfaceY(m.worldX, state.time) - 30, `⚠️ ${MACHINE[m.type].icon} 機器損壞報廢`, 'warn');
      sfx('error');
      state.placed.splice(mi, 1);
      updateMachineBtns(); save();
      continue;
    }
    if (m.type === 'scoop') {
      m.cd = (m.cd || 0) - dt;
      if (m.cd <= 0) {
        const R = MACHINE.scoop.range;
        let idx=-1, best=R;
        for (let i=0;i<state.trash.length;i++){ const d=Math.abs(state.trash[i].worldX-m.worldX); if(d<best){best=d;idx=i;} }
        if (idx>=0){
          const tr=state.trash.splice(idx,1)[0]; m.cd=MACHINE.scoop.cd;
          const gain = 3 + (Math.random()<0.12?20:0);   // 偶爾撈到寶物
          state.coins += gain; state.stats.trash++; state.stats.earned+=gain;
          const sx = tr.worldX - cam();
          toast(sx, surfaceY(tr.worldX,state.time)-20, (gain>10?'💎 寶物 +':'♻️ +')+gain, 'coin');
          sfx(gain>10?'buy':'trash'); checkQuest();
        } else m.cd = 0.5;
      }
    } else { // filter
      const R = MACHINE.filter.range;
      for (const z of state.zones){
        if (z.p<=0) continue;
        if (m.worldX > z.x0-R && m.worldX < z.x1+R){
          const before=z.p;
          z.p = Math.max(0, z.p - MACHINE.filter.rate*dt);
          if (z.p <= CLEAN_P) z.p = 0;   // 低於門檻 → 直接視為完全淨化（與畫面一致，避免殘留看不見的污染卡任務）
          if (before>0 && z.p===0){
            state.stats.cleaned++;
            toast(view.w/2, view.h*0.45, '✨ 海域淨化完成！魚群回來了', 'eco');
            sfx('clean');
            for (let i=0;i<6;i++) spawnFish(z.x0+Math.random()*(z.x1-z.x0));
            checkQuest(); checkAllClean(); save();
          }
        }
      }
    }
  }

  // 污染擴張：尚未淨化的海域會慢慢變寬、變濃；已淨化(p≈0)的不再擴張，確保仍可全清通關
  for (const z of state.zones) {
    if (z.p > 0.02) {
      z.x0 = Math.max(180, z.x0 - POLLUTION_EXPAND * dt);
      z.x1 = Math.min(SHOPS.recycler.x - 110, z.x1 + POLLUTION_EXPAND * dt);
      z.p  = Math.min(1, z.p + POLLUTION_CREEP * dt);   // 淨化機 0.018/s 遠快於此，放對位置仍能清乾淨
    }
  }

  // 海洋健康度：依污染與垃圾平滑變化
  const avgP = state.zones.length ? state.zones.reduce((a,z)=>a+z.p,0)/state.zones.length : 0;
  // 健康度只由「污染區濃度」決定（不受漂浮垃圾數量影響，避免數值忽上忽下）
  const ecoTarget = Math.max(0, Math.min(100, 100 - avgP*65));
  state.eco += (ecoTarget - state.eco) * Math.min(1, dt*0.6);

  // 任務自動巡檢（每秒一次）：被動達成的任務（如健康度回升、全海域淨化）也能即時推進
  questPollT += dt;
  if (questPollT >= 1) { questPollT = 0; checkQuest(); checkAllClean(); }

  updateHUD();
}

function updateLine(dt) {
  const L = state.line;
  if (!L.active) return;
  const maxD = rodReach(state.up.rod);
  const spd = 230;
  if (L.phase==='down') {
    L.depth += spd*dt;
    if (!L.caught) {
      const tipX = state.boat.x, tipY = surfaceY(state.boat.x,state.time)+L.depth;
      const cr = 26 + state.up.rod*3;
      // 受困海龜：鉤子碰到 → 進入救援小遊戲（海龜不會被收進背包）
      const tu = state.turtle;
      if (tu && tu.hideT<=0){
        const tyy = trashScreenY(tu, state.time);
        if (Math.abs(tu.worldX-tipX)<cr+12 && Math.abs(tyy-tipY)<cr+12){
          L.active=false; L.depth=0; L.phase='idle'; L.caught=null;
          startRescue(); return;
        }
      }
      // 海洋垃圾：碰到就鉤起
      for (let i=0;i<state.trash.length;i++){
        const tr=state.trash[i];
        const ty=trashScreenY(tr, state.time);
        if (Math.abs(tr.worldX-tipX)<cr && Math.abs(ty-tipY)<cr){
          L.caught = state.trash.splice(i,1)[0];
          L.phase='up'; break;
        }
      }
    }
    if (L.depth>=maxD) L.phase='up';
  } else if (L.phase==='up') {
    L.depth -= spd*1.15*dt;
    if (L.depth<=0){
      L.depth=0; L.active=false;
      if (L.caught) deliverTrash(L.caught);
      L.phase='idle'; L.caught=null;
    }
  }
}

// 釣起一件垃圾 → 收進背包（背包滿了就放回海裡）
function deliverTrash(tr) {
  const sx = state.boat.x - cam();
  const sy = surfaceY(state.boat.x,state.time)-30;
  if (state.hold.length >= holdFor(state.up.hold)) {
    state.trash.push(tr);   // 放回海面
    toast(sx, sy, '背包滿了！先去海岸清空 ▶', 'warn'); sfx('error');
    return;
  }
  combo++; comboTimer = 6;
  state.hold.push({ key:tr.key, emoji:tr.emoji, name:tr.name });
  state.stats.caught++;
  addSparkle(state.boat.x, surfaceY(state.boat.x,state.time));
  let comboBonus = 0;
  if (combo >= 2) {                                    // 連續撈起 → 小額獎金
    comboBonus = Math.min(combo, 6) * 2;
    state.coins += comboBonus; state.stats.earned += comboBonus;
  }
  toast(sx, sy, '撈到 '+tr.name+' '+tr.emoji+(comboBonus>0?`　連撈 +${comboBonus}🪙`:''), 'eco');
  sfx('catch');
  checkQuest(); save();
}

// 靠岸偵測：回傳最近建築的 key（不在範圍內回 null）
function nearShop(){
  let best=null, bd=SHOP_R;
  for (const k in SHOPS){ const d=Math.abs(state.boat.x - SHOPS[k].x); if (d<bd){ bd=d; best=k; } }
  return best;
}

// ============================================================
//  受困海洋生物事件（海龜 / 水母，都會被塑膠袋纏住）
// ============================================================
const CAPTIVE_KINDS = {
  turtle: { name:'海龜', emoji:'🐢' },
  jelly:  { name:'水母', emoji:'🪼' },
};
function spawnTurtle(){
  const x = 320 + Math.random()*(SHOPS.recycler.x - 640);
  const kind = Math.random()<0.5 ? 'turtle' : 'jelly';
  state.turtle = {
    kind,
    worldX:x,
    depth: 26 + Math.random()*Math.max(30, columnH()*0.4),
    vx:(Math.random()<0.5?-1:1)*(kind==='jelly'?11:18),
    ph:Math.random()*Math.PI*2,
    life: 24,        // 沒被救到的話，撐這麼久後自行游走
    hideT:0,
  };
}
function updateTurtle(dt){
  const tu = state.turtle;
  if (!tu){
    turtleSpawnT -= dt;
    if (turtleSpawnT <= 0) spawnTurtle();
    return;
  }
  tu.ph += dt*2;
  tu.worldX += tu.vx*dt;
  const ahead = tu.worldX + Math.sign(tu.vx)*30;
  if (ahead < 220 || ahead > SHOPS.recycler.x - 140) tu.vx = -tu.vx;
  tu.life -= dt;
  if (tu.life <= 0){            // 純錯過：海龜自行游走，下次再出現
    state.turtle = null;
    turtleSpawnT = 28 + Math.random()*24;
  }
}

// ---- 拯救海龜小遊戲（快速連點解開塑膠袋）----
const turtleOverlay = () => document.getElementById('turtle-overlay');
function captiveInfo(){
  const k = (state.turtle && state.turtle.kind) || 'turtle';
  return CAPTIVE_KINDS[k] || CAPTIVE_KINDS.turtle;
}
function startRescue(){
  if (rescue) return;
  clearKeys();                 // 進入救援畫面時停船
  rescue = { taps:0, need: 24 + Math.floor(Math.random()*9), time: 6, max: 6 };
  const info = captiveInfo();
  document.getElementById('turtleTitle').textContent = `${info.emoji} 受困${info.name}！`;
  document.getElementById('turtleArt').textContent = info.emoji;
  document.getElementById('turtleMsg').innerHTML = `${info.name}被<b>塑膠袋</b>纏住了！<br/><b>快速連點下方按鈕</b>幫牠掙脫！`;
  turtleOverlay().classList.remove('hidden');
  updateRescueUI();
  sfx('cast');
}
function updateRescue(dt){
  if (!rescue) return;
  rescue.time -= dt;
  if (rescue.time <= 0){ endRescue(false); return; }
  updateRescueUI();
}
function rescueTap(){
  if (!rescue) return;
  rescue.taps++;
  sfx('trash');
  const art = document.getElementById('turtleArt');
  if (art) art.textContent = (rescue.taps % 2) ? captiveInfo().emoji : captiveInfo().emoji + '💨';
  if (rescue.taps >= rescue.need) endRescue(true);
  else updateRescueUI();
}
function updateRescueUI(){
  if (!rescue) return;
  document.getElementById('turtleFill').style.width = Math.min(100, rescue.taps/rescue.need*100)+'%';
  document.getElementById('turtleTime').style.width = Math.max(0, rescue.time/rescue.max*100)+'%';
}
function endRescue(success){
  turtleOverlay().classList.add('hidden');
  const info = captiveInfo();
  if (success){
    const reward = 60 + Math.floor(Math.random()*41);   // 60~100
    state.coins += reward; state.stats.earned += reward; state.stats.rescued++;
    toast(view.w/2, view.h*0.4, `${info.emoji}✨ 成功解救${info.name}！+${reward}🪙`, 'coin'); sfx('clean');
    checkQuest();
  } else {
    toast(view.w/2, view.h*0.4, `${info.emoji} ${info.name}掙脫游走了…下次手速再快一點！`, 'warn'); sfx('error');
  }
  state.turtle = null;
  turtleSpawnT = 28 + Math.random()*24;
  rescue = null;
  save();
}

// ============================================================
//  任務
// ============================================================
function checkQuest() {
  let advanced = false, slot = 0;
  // 最後一個是「最終目標」，只展示不自動結算（由 checkAllClean 另外給通關獎勵）
  while (state.questIdx < QUESTS.length - 1) {
    const q = QUESTS[state.questIdx];
    if (!q || !q.done(state)) break;
    state.coins += q.reward; state.stats.earned += q.reward;
    toast(view.w/2, view.h*0.5 + slot*30, `✅ 任務完成！+${q.reward} 🪙`, 'coin');
    state.questIdx++; advanced = true; slot++;
  }
  if (advanced) save();
  showQuest();
}
let _lastQuestHTML = '';
function showQuest() {
  const el = document.getElementById('quest-banner');
  if (tutStep >= 0) { el.classList.add('hidden'); _lastQuestHTML=''; return; }   // 教學進行中先隱藏任務橫幅
  const q = QUESTS[state.questIdx];
  if (!q){ el.classList.add('hidden'); _lastQuestHTML=''; return; }
  el.classList.remove('hidden');
  let html;
  // 最終任務且已達成 → 顯示通關訊息，而不是繼續掛著「淨化海洋」
  if (state.questIdx === QUESTS.length - 1 && q.done(state)) {
    html = `🎉 <b>恭喜通關！海洋已全部淨化！</b>`;
  } else {
    let bar = '';
    if (q.prog) {
      const [curRaw, max] = q.prog(state);
      const cur = Math.max(0, Math.min(curRaw, max));
      const pct = max ? (cur / max * 100) : 0;
      bar = `<div class="quest-prog"><div class="quest-prog-fill" style="width:${pct}%"></div></div>`
          + `<span class="quest-prog-num">${cur} / ${max}</span>`;
    }
    html = `<div class="quest-title">🎯 任務：<b>${q.text}</b></div>${bar}`;
  }
  if (html !== _lastQuestHTML) { _lastQuestHTML = html; el.innerHTML = html; }   // 內容沒變就不重寫 DOM
}

// ============================================================
//  繪製
// ============================================================
function cam() {
  let c = state.boat.x - view.w/2;
  return Math.max(0, Math.min(WORLD_W - view.w, c));
}

function dayColors() {
  const h = (state.time/DAY_LEN)*24;
  // 關鍵時段顏色
  const stops = [
    { h:0,  top:'#0a1430', bot:'#16314f' }, // 深夜
    { h:5.5,top:'#1a2a4a', bot:'#3a5d7a' }, // 黎明
    { h:8,  top:'#7ec0ee', bot:'#cdeafe' }, // 早晨
    { h:13, top:'#6db8f0', bot:'#bfe6ff' }, // 正午
    { h:17.5,top:'#f6a85c', bot:'#ffd9a0' },// 黃昏
    { h:19.5,top:'#3a3f6a', bot:'#7a5a8a' },// 暮色
    { h:24, top:'#0a1430', bot:'#16314f' },
  ];
  let a=stops[0], b=stops[stops.length-1];
  for (let i=0;i<stops.length-1;i++){ if (h>=stops[i].h && h<=stops[i+1].h){ a=stops[i]; b=stops[i+1]; break; } }
  const f=(h-a.h)/((b.h-a.h)||1);
  return { top: lerpHex(a.top,b.top,f), bot: lerpHex(a.bot,b.bot,f), h };
}
function lerpHex(c1,c2,t){
  const p=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
  const a=p(c1),b=p(c2);
  const m=i=>Math.round(a[i]+(b[i]-a[i])*t);
  return `rgb(${m(0)},${m(1)},${m(2)})`;
}

function render() {
  const t = state.time, c = cam(), W = view.w, H = view.h;
  const dc = dayColors();
  const night = isNight();

  // 天空
  const sky = ctx.createLinearGradient(0,0,0,seaY+40);
  sky.addColorStop(0, dc.top); sky.addColorStop(1, dc.bot);
  ctx.fillStyle = sky; ctx.fillRect(0,0,W,seaY+40);

  // 太陽 / 月亮 (沿天空弧線)
  drawCelestial(dc.h, W, H);

  // 遠景雲 (慢速視差)
  drawClouds(c, night);
  // 海鷗 (白天)
  if (!night) drawBirds(c, t);

  // 海水
  drawSea(c, t, night);

  // 海底沙地 + 海草 / 螃蟹 / 貝殼
  drawSeabed(c, t);

  // 污染區 (深色 + 塑膠微粒)
  drawPollution(c, t);

  // 魚群
  drawFish(c, t);

  // 漂浮垃圾
  drawTrash(c, t);

  // 受困海龜
  drawTurtle(c, t);

  // 放置在海上的環保機器
  drawPlaced(c, t);

  // 釣線 + 船 + 漁夫
  drawLine(c, t);
  drawBoat(c, t);

  // 水花 / 收線星光
  drawFx(c);

  // 漁港
  drawDock(c, t);

  // 夜晚暗化
  if (night) { ctx.fillStyle='rgba(10,15,40,0.28)'; ctx.fillRect(0,0,W,H); }

  // 導航提示（畫面外的漁港與污染區）
  drawNav(c);
  // Combo 連釣顯示
  drawCombo();

  // 靠岸提示（顯示最近的建築名稱）
  const ns = running ? nearShop() : null;
  const hideDock = !ns || shopOpen() || paused;
  const dh = (HUD._dockHint || (HUD._dockHint = document.getElementById('dockHint')));
  if (_hudPrev.hideDock !== hideDock){ _hudPrev.hideDock = hideDock; dh.classList.toggle('hidden', hideDock); }
  if (ns && _hudPrev.dockShop !== ns){ _hudPrev.dockShop = ns; dh.textContent = `${SHOPS[ns].icon} 進入「${SHOPS[ns].name}」`; }
}

function drawCelestial(h, W, H) {
  // 太陽白天、月亮夜晚，沿弧線移動
  const dayPhase = (h-6)/12;           // 6點到18點 0→1
  let x, y, isMoon=false;
  if (h>=6 && h<=18){ x=dayPhase*W; }
  else { const np=((h<6?h+6:h-18))/12; x=np*W; isMoon=true; }
  const px=x; const py=seaY*0.85 - Math.sin(Math.PI*(isMoon?((h<6?h+6:h-18))/12:dayPhase))*seaY*0.55;
  ctx.save();
  if (isMoon){
    ctx.fillStyle='rgba(245,245,220,0.95)';
    ctx.shadowColor='rgba(255,255,220,0.6)'; ctx.shadowBlur=24;
    ctx.beginPath(); ctx.arc(px,py,20,0,7); ctx.fill();
  } else {
    const g=ctx.createRadialGradient(px,py,4,px,py,60);
    g.addColorStop(0,'rgba(255,250,210,1)'); g.addColorStop(0.4,'rgba(255,225,150,0.9)'); g.addColorStop(1,'rgba(255,210,120,0)');
    ctx.fillStyle=g; ctx.beginPath(); ctx.arc(px,py,60,0,7); ctx.fill();
    ctx.fillStyle='#fff6c8'; ctx.beginPath(); ctx.arc(px,py,26,0,7); ctx.fill();
  }
  ctx.restore();
}

let cloudSeeds = Array.from({length:9},(_,i)=>({x:i*640+120, y:40+(i*53)%120, s:0.6+(i%3)*0.25}));
function drawClouds(c, night) {
  ctx.save();
  ctx.fillStyle = night ? 'rgba(200,210,235,0.18)' : 'rgba(255,255,255,0.85)';
  for (const cl of cloudSeeds) {
    const sx = (cl.x - c*0.25) % (WORLD_W*0.5);
    const x = ((sx%(view.w+260))+(view.w+260))%(view.w+260) - 130;
    puff(x, cl.y, cl.s);
  }
  ctx.restore();
}
function puff(x,y,s){
  ctx.beginPath();
  ctx.ellipse(x,y,46*s,22*s,0,0,7);
  ctx.ellipse(x+38*s,y+6*s,34*s,18*s,0,0,7);
  ctx.ellipse(x-38*s,y+6*s,30*s,16*s,0,0,7);
  ctx.fill();
}

const birdSeeds = [{x:300,y:80,s:1.0},{x:760,y:120,s:0.8},{x:1180,y:70,s:1.1}];
function drawBirds(c, t) {
  ctx.save();
  ctx.strokeStyle='rgba(60,70,90,0.5)'; ctx.lineWidth=2; ctx.lineCap='round';
  for (let i=0;i<birdSeeds.length;i++){
    const b=birdSeeds[i];
    const period=view.w+200;
    const x=((b.x + t*14*(0.6+i*0.2) - c*0.4) % period + period) % period - 100;
    const flap=Math.sin(t*4+i)*4;
    ctx.beginPath();
    ctx.moveTo(x-8*b.s, b.y);
    ctx.quadraticCurveTo(x, b.y-6-flap, x+8*b.s, b.y);  // 左右翅膀
    ctx.stroke();
  }
  ctx.restore();
}

// 畫面外目標的方向提示
function drawNav(c) {
  const y = seaY + 40;
  // 海岸建築群在右方畫面外
  const harborSx = SHOPS.recycler.x - c;
  if (harborSx > view.w - 8) {
    const dist = Math.max(0, Math.round((SHOPS.recycler.x - state.boat.x)));
    drawNavChip(view.w - 64, y, '🏪▶', dist + 'm', 'rgba(255,204,68,0.9)', '#3a2700');
  }
  // 污染區在畫面外
  for (const z of state.zones) {
    if (z.p <= 0.05) continue;
    const mid = (z.x0 + z.x1)/2, sx = mid - c;
    if (sx < 0) drawNavChip(40, y + 44, '◀⚠', '', 'rgba(70,90,60,0.9)', '#fff');
    else if (sx > view.w) drawNavChip(view.w - 40, y + 44, '⚠▶', '', 'rgba(70,90,60,0.9)', '#fff');
  }
  // 受困生物在畫面外 → 紅色指示，提醒玩家把握時間
  const tu = state.turtle;
  if (tu && tu.hideT<=0){
    const emo = (CAPTIVE_KINDS[tu.kind] || CAPTIVE_KINDS.turtle).emoji;
    const sx = tu.worldX - c;
    if (sx < 0) drawNavChip(40, y, '◀'+emo, '快去', 'rgba(255,80,90,0.92)', '#fff');
    else if (sx > view.w) drawNavChip(view.w - 64, y + 44, emo+'▶', '快去', 'rgba(255,80,90,0.92)', '#fff');
  }
}
function drawNavChip(x, y, label, sub, bg, fg) {
  ctx.save();
  ctx.font='bold 13px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
  const w = sub ? 58 : 40;
  ctx.fillStyle=bg;
  ctx.beginPath();
  if (ctx.roundRect) ctx.roundRect(x-w/2, y-13, w, 26, 13);
  else ctx.rect(x-w/2, y-13, w, 26);
  ctx.fill();
  ctx.fillStyle=fg; ctx.fillText(label, x, sub ? y-4 : y);
  if (sub){ ctx.font='10px sans-serif'; ctx.fillText(sub, x, y+8); }
  ctx.restore();
}

// Combo 連釣顯示
function drawCombo() {
  if (combo < 2 || comboTimer <= 0) return;
  ctx.save();
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.font='bold 22px sans-serif';
  const alpha = Math.min(1, comboTimer/1.5);
  ctx.fillStyle=`rgba(255,170,40,${alpha})`;
  // 放在海面下方一點：避開上方「任務 + 委託」資訊堆疊（手機直向時堆疊較高，會擋到文字）
  const comboY = seaY + 36;
  ctx.fillText(`🔥 連撈 ${combo} 連！`, view.w/2, comboY);
  // 計時條
  const bw=120, bx=view.w/2-bw/2, by=comboY+18;
  ctx.fillStyle=`rgba(255,255,255,${0.2*alpha})`; ctx.fillRect(bx,by,bw,4);
  ctx.fillStyle=`rgba(255,170,40,${alpha})`; ctx.fillRect(bx,by,bw*(comboTimer/6),4);
  ctx.restore();
}
function drawSea(c, t, night) {
  const W=view.w, H=view.h;
  // 海水漸層
  const g=ctx.createLinearGradient(0,seaY,0,H);
  if (night){ g.addColorStop(0,'#13496b'); g.addColorStop(0.5,'#0c2f4d'); g.addColorStop(1,'#06182b'); }
  else { g.addColorStop(0,'#2aa6c8'); g.addColorStop(0.45,'#1c6e98'); g.addColorStop(1,'#0c3a5c'); }
  // 海面波形路徑
  ctx.beginPath();
  ctx.moveTo(0,H);
  ctx.lineTo(0, surfaceY(c,t));
  for (let sx=0;sx<=W;sx+=10){ ctx.lineTo(sx, surfaceY(c+sx,t)); }
  ctx.lineTo(W,H); ctx.closePath();
  ctx.fillStyle=g; ctx.fill();

  // 海面泡沫高光線
  ctx.beginPath();
  for (let sx=0;sx<=W;sx+=10){ const y=surfaceY(c+sx,t); if(sx===0)ctx.moveTo(sx,y); else ctx.lineTo(sx,y); }
  ctx.strokeStyle='rgba(255,255,255,0.5)'; ctx.lineWidth=2; ctx.stroke();

  // 水中陽光（柔和的丁達爾光，往深處淡出）
  ctx.save();
  ctx.globalCompositeOperation = 'lighter';
  for (let i=0;i<5;i++){
    const period = W + 220;
    const x = ((i*270 + 90 - c*0.18) % period + period) % period - 110;
    const topY = surfaceY(c+x, t);
    const botY = topY + (H - topY) * 0.78;
    const g = ctx.createLinearGradient(x, topY, x, botY);
    const a = night ? 0.022 : 0.05;
    g.addColorStop(0, `rgba(205,242,255,${a})`);
    g.addColorStop(1, 'rgba(205,242,255,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.moveTo(x - 12, topY);
    ctx.lineTo(x + 20, topY);
    ctx.lineTo(x + 62, botY);
    ctx.lineTo(x + 6, botY);
    ctx.closePath();
    ctx.fill();
  }
  ctx.restore();
}

// ---------- 海底裝飾（固定種子，隨攝影機捲動） ----------
// rank：出現門檻 0~1，海洋越乾淨（lifeFrac 越高）才會陸續出現越多生物
const rankOf = x => ((Math.floor(x*0.37)%100)+1)/101;
const SEABED = (() => {
  const weeds=[], rocks=[], decos=[], crabs=[];
  for (let x=120; x<WORLD_W-160; x += 58 + (Math.floor(x*7)%46))
    weeds.push({ x, h: 20 + (Math.floor(x*1.7)%26), blades: 2 + (x%3), hue: (x%2)?'#2faa6a':'#48c07a', ph:(x%628)/100, rank: rankOf(x) });
  for (let x=320; x<WORLD_W-160; x += 210 + (Math.floor(x*1.1)%140))
    rocks.push({ x, r: 9 + (Math.floor(x*0.3)%9) });   // 石頭是地質，一律顯示
  for (let x=220; x<WORLD_W-160; x += 150 + (Math.floor(x*0.5)%90))
    decos.push({ x, k: Math.floor(x)%3, rank: rankOf(x+40) });   // 0=貝殼 1=海星 2=海螺
  for (let i=0;i<6;i++) crabs.push({ base: 380 + i*420, range: 55 + i*14, sp: 0.45 + i*0.1, ph: i*1.3, hideT: 0, rank: (i+0.5)/6 });
  return { weeds, rocks, decos, crabs };
})();
// 海洋生機程度：依已淨化的污染區數量，剩 1~2 區才開始陸續出現生物，全淨化最茂盛
function lifeFracNow(){
  const total = state.zones.length, cleaned = cleanedZones(state);
  return total>1 ? Math.max(0, (cleaned-1)/(total-1)) : (cleaned>0?1:0);
}

function drawSeabed(c, t) {
  const top = view.h - 46;
  ctx.save();
  // 沙地
  const g = ctx.createLinearGradient(0, top-12, 0, view.h);
  g.addColorStop(0, '#c8a868'); g.addColorStop(1, '#9c7e46');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.moveTo(0, view.h); ctx.lineTo(0, top);
  for (let sx=0; sx<=view.w; sx+=14) ctx.lineTo(sx, top + Math.sin((c+sx)*0.02)*5);
  ctx.lineTo(view.w, view.h); ctx.closePath(); ctx.fill();
  // 沙面亮邊
  ctx.strokeStyle='rgba(255,240,200,0.3)'; ctx.lineWidth=2;
  ctx.beginPath();
  for (let sx=0; sx<=view.w; sx+=14){ const yy=top+Math.sin((c+sx)*0.02)*5; if(sx===0)ctx.moveTo(sx,yy); else ctx.lineTo(sx,yy); }
  ctx.stroke();
  const life = lifeFracNow();   // 海洋越乾淨，海底生物越多
  // 海草（隨乾淨程度長出來）
  for (const w of SEABED.weeds){ if (w.rank > life) continue; const x=w.x-c; if(x<-30||x>view.w+30) continue; drawSeaweed(x, top+4, w, t); }
  // 石頭（地質，一律顯示）
  for (const r of SEABED.rocks){ const x=r.x-c; if(x<-30||x>view.w+30) continue;
    ctx.fillStyle='#6f7a82'; ctx.beginPath(); ctx.ellipse(x, top+5, r.r, r.r*0.6, 0, Math.PI, 0); ctx.fill();
    ctx.fillStyle='#5c666d'; ctx.beginPath(); ctx.ellipse(x-r.r*0.3, top+5, r.r*0.4, r.r*0.28, 0, Math.PI, 0); ctx.fill(); }
  // 貝殼 / 海星 / 海螺（乾淨後才陸續出現）
  for (const d of SEABED.decos){ if (d.rank > life) continue; const x=d.x-c; if(x<-20||x>view.w+20) continue;
    if(d.k===1) drawStarfish(x, top); else if(d.k===2) drawSnail(x, top); else drawShell(x, top); }
  // 螃蟹（乾淨後才出現；左右走動）
  for (const cr of SEABED.crabs){ if(cr.hideT>0 || cr.rank > life) continue; const wx=cr.base + Math.sin(t*cr.sp+cr.ph)*cr.range; const x=wx-c; if(x<-30||x>view.w+30) continue; drawCrab(x, top+2, t, cr); }
  ctx.restore();
}
function drawSeaweed(x, baseY, w, t) {
  ctx.strokeStyle=w.hue; ctx.lineWidth=3; ctx.lineCap='round';
  for (let b=0;b<w.blades;b++){
    const off=(b-(w.blades-1)/2)*4;
    const sway=Math.sin(t*1.2 + w.ph + b)*6;
    ctx.beginPath(); ctx.moveTo(x+off, baseY);
    ctx.quadraticCurveTo(x+off+sway*0.5, baseY-w.h*0.5, x+off+sway, baseY-w.h); ctx.stroke();
  }
}
function drawCrab(x, gy, t, cr) {
  ctx.save(); ctx.translate(x, gy);
  // 腳（擺動）
  ctx.strokeStyle='#b53224'; ctx.lineWidth=1.5; ctx.lineCap='round';
  const lp=Math.sin(t*6+cr.ph)*1.6;
  for (let i=0;i<3;i++){ const lx=4+i*3;
    ctx.beginPath(); ctx.moveTo(-lx,-3); ctx.lineTo(-lx-3, 1+(i%2?lp:-lp)); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(lx,-3); ctx.lineTo(lx+3, 1+(i%2?-lp:lp)); ctx.stroke(); }
  // 螯
  ctx.fillStyle='#e74c3c';
  ctx.beginPath(); ctx.ellipse(-9,-6,3.2,2.4,0.4,0,7); ctx.ellipse(9,-6,3.2,2.4,-0.4,0,7); ctx.fill();
  // 身體
  ctx.beginPath(); ctx.ellipse(0,-5,8,5,0,0,7); ctx.fill();
  // 眼柄 + 眼睛
  ctx.strokeStyle='#e74c3c'; ctx.lineWidth=1.4;
  ctx.beginPath(); ctx.moveTo(-2,-9); ctx.lineTo(-2,-12); ctx.moveTo(2,-9); ctx.lineTo(2,-12); ctx.stroke();
  ctx.fillStyle='#1a1a1a'; ctx.beginPath(); ctx.arc(-2,-12.5,1.4,0,7); ctx.arc(2,-12.5,1.4,0,7); ctx.fill();
  ctx.restore();
}
function drawStarfish(x, gy) {
  ctx.save(); ctx.translate(x, gy-3); ctx.fillStyle='#e8884a';
  ctx.beginPath();
  for (let i=0;i<5;i++){ const a=-Math.PI/2+i*2*Math.PI/5, a2=a+Math.PI/5;
    ctx.lineTo(Math.cos(a)*5, Math.sin(a)*5); ctx.lineTo(Math.cos(a2)*2.2, Math.sin(a2)*2.2); }
  ctx.closePath(); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.4)'; ctx.beginPath(); ctx.arc(0,0,1.4,0,7); ctx.fill();
  ctx.restore();
}
function drawShell(x, gy) {
  ctx.save(); ctx.translate(x, gy-2); ctx.fillStyle='#f0c9b0';
  ctx.beginPath(); ctx.arc(0,0,4,Math.PI,0); ctx.fill();
  ctx.strokeStyle='#d9a98a'; ctx.lineWidth=0.8;
  for (let i=1;i<4;i++){ ctx.beginPath(); ctx.moveTo(0,0); ctx.lineTo(Math.cos(Math.PI+i*Math.PI/4)*4, Math.sin(Math.PI+i*Math.PI/4)*4); ctx.stroke(); }
  ctx.restore();
}
// 海螺：螺旋殼
function drawSnail(x, gy) {
  ctx.save(); ctx.translate(x, gy-4);
  ctx.fillStyle='#e9b07a';
  ctx.beginPath(); ctx.moveTo(-4,4);
  for (let a=0;a<14;a++){ const ang=a*0.6, r=1+a*0.42; ctx.lineTo(Math.cos(ang)*r, 4-Math.sin(ang)*r); }
  ctx.lineTo(4,4); ctx.closePath(); ctx.fill();
  ctx.strokeStyle='#c98a52'; ctx.lineWidth=0.7;
  ctx.beginPath();
  for (let a=0;a<14;a++){ const ang=a*0.6, r=1+a*0.42; const px=Math.cos(ang)*r, py=4-Math.sin(ang)*r; if(a===0)ctx.moveTo(px,py); else ctx.lineTo(px,py); }
  ctx.stroke();
  ctx.restore();
}

function drawPollution(c, t) {
  for (const z of state.zones) {
    if (z.p<=CLEAN_P) continue;
    const x0=z.x0-c, x1=z.x1-c;
    if (x1<-20||x0>view.w+20) continue;
    ctx.save();
    // 鮮豔的污染水（亮紫洋紅，與藍色海水對比強烈，白天夜晚都清楚）
    const g=ctx.createLinearGradient(0,seaY,0,view.h);
    g.addColorStop(0,`rgba(214,68,196,${0.45*z.p})`);
    g.addColorStop(0.5,`rgba(170,46,200,${0.55*z.p})`);
    g.addColorStop(1,`rgba(120,28,165,${0.78*z.p})`);
    ctx.fillStyle=g;
    ctx.beginPath();
    ctx.moveTo(x0, view.h);
    for (let sx=x0;sx<=x1;sx+=10){ ctx.lineTo(sx, surfaceY(c+sx,t)); }
    ctx.lineTo(x1, view.h); ctx.closePath(); ctx.fill();
    // 海面上的鮮豔污染帶（讓玩家從水面就一眼看到污染區範圍）
    ctx.lineWidth=4; ctx.lineCap='round';
    ctx.strokeStyle=`rgba(255,90,220,${Math.min(0.9,0.5+0.4*z.p)})`;
    ctx.beginPath();
    for (let sx=x0;sx<=x1;sx+=10){ const yy=surfaceY(c+sx,t); if(sx===x0)ctx.moveTo(sx,yy); else ctx.lineTo(sx,yy); }
    ctx.stroke();
    // 塑膠微粒（亮黃綠光點，在紫色上對比鮮明）
    const n=Math.floor((z.x1-z.x0)/22 * z.p);
    ctx.fillStyle=`rgba(214,255,140,${0.7*z.p})`;
    for (let i=0;i<n;i++){
      const wx=z.x0+((i*53)%(z.x1-z.x0));
      const px=wx-c; if(px<-5||px>view.w+5) continue;
      const py=surfaceY(c+ (wx-c),t)+30+((i*37)%(view.h-seaY-40)) + Math.sin(t*1.3+i)*4;
      ctx.beginPath(); ctx.arc(px,py,1.8+ (i%2),0,7); ctx.fill();
    }
    ctx.restore();
  }
}

function drawFish(c, t) {
  for (const f of state.fish) {
    const x=f.worldX-c; if(x<-40||x>view.w+40) continue;
    const y=fishScreenY(f, t);
    const dir=f.vx<0?-1:1;
    ctx.save(); ctx.translate(x,y); ctx.scale(dir,1);
    drawFishBody(f.t, f.ph);
    ctx.restore();
  }
}
function fishEye(ex, ey, r) {
  ctx.fillStyle='#ffffff'; ctx.beginPath(); ctx.arc(ex,ey,r,0,7); ctx.fill();
  ctx.fillStyle='#06222e'; ctx.beginPath(); ctx.arc(ex+r*0.3,ey,r*0.55,0,7); ctx.fill();
}
// 依魚種畫不同外型（一律朝右，dir 翻轉由外層處理）
function drawFishBody(ty, ph) {
  const s = ty.size || 1;
  const col = ty.color;
  // 暗色只跟魚種顏色有關，快取在魚種物件上，避免每幀對每條魚重複解析色碼字串
  const dark = ty._dark || (ty._dark = lerpHex(col, '#0a2733', 0.42));
  const tw = Math.sin(ph) * 2;   // 尾巴擺動
  ctx.lineCap='round';
  switch (ty.shape) {
    case 'bream': { // 真鯛：身體高、背鰭明顯、叉尾
      ctx.fillStyle=dark;
      ctx.beginPath(); ctx.moveTo(-4*s,-6*s); ctx.lineTo(5*s,-5*s); ctx.lineTo(2*s,-12*s); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.moveTo(0,5*s); ctx.lineTo(4*s,5*s); ctx.lineTo(1*s,9*s); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.moveTo(-7*s,0); ctx.lineTo(-15*s,-7*s+tw); ctx.lineTo(-11*s,0); ctx.lineTo(-15*s,7*s+tw); ctx.closePath(); ctx.fill();
      ctx.fillStyle=col; ctx.beginPath(); ctx.ellipse(0,0,9*s,7*s,0,0,7); ctx.fill();
      fishEye(4*s,-2*s,1.8*s); break;
    }
    case 'tuna': { // 鮪魚：流線魚雷狀、月牙尾、大
      ctx.fillStyle=dark;
      ctx.beginPath(); ctx.moveTo(-7*s,0); ctx.lineTo(-17*s,-8*s+tw); ctx.quadraticCurveTo(-12*s,0,-17*s,8*s+tw); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.moveTo(-1*s,-5*s); ctx.lineTo(6*s,-5*s); ctx.lineTo(0,-11*s); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.moveTo(2*s,2*s); ctx.lineTo(9*s,6*s); ctx.lineTo(2*s,5*s); ctx.closePath(); ctx.fill();
      ctx.fillStyle=col;
      ctx.beginPath(); ctx.moveTo(14*s,0);
      ctx.quadraticCurveTo(5*s,-7*s,-7*s,-4*s);
      ctx.quadraticCurveTo(-11*s,0,-7*s,4*s);
      ctx.quadraticCurveTo(5*s,7*s,14*s,0); ctx.fill();
      fishEye(9*s,-1.5*s,1.7*s); break;
    }
    case 'puffer': { // 河豚：圓球+刺
      ctx.fillStyle=col; ctx.beginPath(); ctx.moveTo(-7*s,0); ctx.lineTo(-12*s,-4*s); ctx.lineTo(-12*s,4*s); ctx.closePath(); ctx.fill();
      ctx.fillStyle=dark;
      for(let a=0;a<10;a++){ const ang=a/10*Math.PI*2, c0=Math.cos(ang), s0=Math.sin(ang), px=-s0, py=c0;
        ctx.beginPath();
        ctx.moveTo(c0*7*s+px*2*s, s0*7*s+py*2*s);
        ctx.lineTo(c0*12*s, s0*12*s);
        ctx.lineTo(c0*7*s-px*2*s, s0*7*s-py*2*s); ctx.closePath(); ctx.fill(); }
      ctx.fillStyle=col; ctx.beginPath(); ctx.arc(0,0,8*s,0,7); ctx.fill();
      fishEye(4*s,-2*s,2.1*s); break;
    }
    case 'squid': { // 魷魚：尖外套膜+觸手
      ctx.fillStyle=dark; ctx.beginPath(); ctx.ellipse(-12*s,0,4*s,6*s,0,0,7); ctx.fill();
      ctx.strokeStyle=col; ctx.lineWidth=1.6*s;
      for(let i=-2;i<=2;i++){ const yy=i*1.6*s;
        ctx.beginPath(); ctx.moveTo(3*s,yy);
        ctx.quadraticCurveTo(9*s,yy+Math.sin(ph+i)*2, 14*s, yy+i*1.2*s); ctx.stroke(); }
      ctx.fillStyle=col;
      ctx.beginPath(); ctx.moveTo(-15*s,0);
      ctx.quadraticCurveTo(-6*s,-6*s,3*s,-5*s);
      ctx.quadraticCurveTo(8*s,0,3*s,5*s);
      ctx.quadraticCurveTo(-6*s,6*s,-15*s,0); ctx.fill();
      ctx.fillStyle='#ffffff'; ctx.beginPath(); ctx.arc(0,-1*s,2.3*s,0,7); ctx.fill();
      ctx.fillStyle='#06222e'; ctx.beginPath(); ctx.arc(0.6*s,-1*s,1.1*s,0,7); ctx.fill(); break;
    }
    case 'shrimp': { // 甜蝦：彎曲身體+尾扇+觸鬚
      ctx.strokeStyle=col; ctx.lineWidth=1*s;
      ctx.beginPath(); ctx.moveTo(7*s,-1*s); ctx.lineTo(16*s,-6*s); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(7*s,0); ctx.lineTo(16*s,-1*s); ctx.stroke();
      ctx.fillStyle=dark; ctx.beginPath();
      ctx.moveTo(-7*s,1*s); ctx.lineTo(-13*s,-3*s); ctx.lineTo(-11*s,1*s); ctx.lineTo(-13*s,5*s); ctx.closePath(); ctx.fill();
      ctx.fillStyle=col; ctx.save(); ctx.rotate(-0.25);
      ctx.beginPath(); ctx.ellipse(0,0,9*s,4.6*s,0,0,7); ctx.fill(); ctx.restore();
      ctx.strokeStyle=dark; ctx.lineWidth=0.8*s;
      for(let i=0;i<4;i++){ const lx=-3*s+i*3*s; ctx.beginPath(); ctx.moveTo(lx,3*s); ctx.lineTo(lx-1*s,7*s); ctx.stroke(); }
      ctx.fillStyle='#06222e'; ctx.beginPath(); ctx.arc(6*s,-2*s,1.4*s,0,7); ctx.fill(); break;
    }
    default: { // 沙丁魚 / 一般魚：細長
      ctx.fillStyle=dark;
      ctx.beginPath(); ctx.moveTo(-9*s,0); ctx.lineTo(-16*s,-5*s+tw); ctx.lineTo(-16*s,5*s+tw); ctx.closePath(); ctx.fill();
      ctx.beginPath(); ctx.moveTo(0,-4*s); ctx.lineTo(5*s,-4*s); ctx.lineTo(1*s,-8*s); ctx.closePath(); ctx.fill();
      ctx.fillStyle=col; ctx.beginPath(); ctx.ellipse(0,0,11*s,5*s,0,0,7); ctx.fill();
      fishEye(6*s,-1.5*s,1.6*s);
    }
  }
}

// 圓角矩形小工具（不依賴 ctx.roundRect，相容較舊的手機瀏覽器）
function rrect(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}
// 用向量畫海洋垃圾，取代 emoji：手機 canvas 對彩色 emoji 支援不一，
// 常會用當下 fillStyle 畫成單色（前面畫海水/魚 → 變成藍色塊）。向量在所有裝置都一致。
// 已在呼叫端 translate 到中心點，這裡以 (0,0) 為中心繪製。
function drawTrashItem(key){
  ctx.lineWidth=1; ctx.lineJoin='round';
  switch(key){
    case 'bottle': { // 寶特瓶（透明淡藍）
      ctx.fillStyle='#bfe9f5'; rrect(-5,-6,10,16,4); ctx.fill();
      ctx.strokeStyle='rgba(255,255,255,0.7)'; ctx.stroke();
      ctx.fillStyle='#e8f7fc'; rrect(-3.5,-4,2.5,11,1.2); ctx.fill(); // 高光
      ctx.fillStyle='#5bb7d6'; rrect(-3,-11,6,5,1.5); ctx.fill();     // 瓶蓋
      break; }
    case 'bag': { // 塑膠袋（半透明白，兩個提把）
      ctx.fillStyle='rgba(238,247,252,0.92)';
      ctx.beginPath(); ctx.moveTo(-7,-1); ctx.lineTo(7,-1); ctx.lineTo(5,11); ctx.lineTo(-5,11); ctx.closePath(); ctx.fill();
      ctx.strokeStyle='rgba(255,255,255,0.85)'; ctx.lineWidth=2;
      ctx.beginPath(); ctx.arc(-3,-1,3,Math.PI,0,true); ctx.stroke();
      ctx.beginPath(); ctx.arc(3,-1,3,Math.PI,0,true); ctx.stroke();
      break; }
    case 'jug': { // 清潔/乳液瓶（白底＋泵頭）
      ctx.fillStyle='#eef3f6'; rrect(-5,-4,10,14,3); ctx.fill();
      ctx.strokeStyle='rgba(0,0,0,0.15)'; ctx.lineWidth=1; ctx.stroke();
      ctx.fillStyle='#7f91a3'; rrect(-2,-10,4,6,1); ctx.fill();   // 泵頸
      ctx.fillStyle='#7f91a3'; rrect(-6,-11,5,2,1); ctx.fill();   // 泵嘴
      ctx.fillStyle='#cfe0ec'; rrect(-4,2,8,5,1); ctx.fill();     // 標籤
      break; }
    case 'can': { // 鋁罐（銀色圓柱＋紅環）
      ctx.fillStyle='#cdd5da'; rrect(-5,-9,10,18,2); ctx.fill();
      ctx.fillStyle='#eef2f4'; rrect(-5,-9,3,18,2); ctx.fill();   // 高光
      ctx.fillStyle='#e3402f'; ctx.fillRect(-5,-2,10,4);          // 紅環
      ctx.fillStyle='#9aa3a9'; ctx.beginPath(); ctx.ellipse(0,-9,5,1.6,0,0,7); ctx.fill();
      break; }
    case 'foam': { // 保麗龍（白色方塊＋顆粒）
      ctx.fillStyle='#f3f3ee'; rrect(-8,-7,16,15,2); ctx.fill();
      ctx.strokeStyle='rgba(0,0,0,0.08)'; ctx.lineWidth=1; ctx.stroke();
      ctx.fillStyle='rgba(0,0,0,0.06)';
      for(const p of [[-4,-3],[2,-4],[-2,2],[4,1],[0,-1]]){ ctx.beginPath(); ctx.arc(p[0],p[1],1.3,0,7); ctx.fill(); }
      break; }
    case 'slipper': { // 夾腳拖（彩色鞋底＋人字帶）
      ctx.fillStyle='#ff7aa0'; ctx.beginPath(); ctx.ellipse(0,2,6,10,0,0,7); ctx.fill();
      ctx.fillStyle='#ffd0de'; ctx.beginPath(); ctx.ellipse(0,2,4.2,8,0,0,7); ctx.fill();
      ctx.strokeStyle='#c94f74'; ctx.lineWidth=1.6;
      ctx.beginPath(); ctx.moveTo(0,-5); ctx.lineTo(-3.5,4); ctx.moveTo(0,-5); ctx.lineTo(3.5,4); ctx.stroke();
      break; }
    default: { ctx.fillStyle='#cdd5da'; rrect(-6,-6,12,12,3); ctx.fill(); }
  }
}
function drawTrash(c, t) {
  for (const tr of state.trash) {
    const x=tr.worldX-c; if(x<-30||x>view.w+30) continue;
    const y=trashScreenY(tr,t);
    ctx.save(); ctx.translate(x,y); ctx.rotate(Math.sin(tr.ph*0.5)*0.2);
    drawTrashItem(tr.key);
    ctx.restore();
  }
}

// 受困海龜（頭上紅色 ❗，提示可用釣竿碰觸救援）
// 受困生物（海龜 / 水母）：畫身體 → 纏住的塑膠袋 → 頭上 ❗
function drawTurtle(c, t) {
  const tu = state.turtle; if (!tu || tu.hideT>0) return;
  const x = tu.worldX - c; if (x<-40||x>view.w+40) return;
  const y = trashScreenY(tu, t);
  ctx.save(); ctx.translate(x,y);
  if (tu.kind === 'jelly') drawJellyBody(tu, t);
  else drawTurtleBody(tu, t);
  // 纏住的塑膠袋（半透明白，蓋在身上）
  ctx.fillStyle='rgba(238,245,253,0.5)';
  ctx.beginPath(); ctx.ellipse(0,1,17,13,0,0,7); ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,0.55)'; ctx.lineWidth=1; ctx.stroke();
  // 頭上紅色驚嘆號泡泡
  const bob = Math.sin(t*4)*2;
  ctx.fillStyle='rgba(255,255,255,0.95)';
  ctx.beginPath(); ctx.arc(0,-24+bob,9,0,7); ctx.fill();
  ctx.fillStyle='#ff3b46'; ctx.font='bold 15px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText('❗',0,-23+bob);
  ctx.textBaseline='alphabetic';
  ctx.restore();
}
function drawTurtleBody(tu, t) {
  const dir = tu.vx<0 ? -1 : 1;
  ctx.save(); ctx.scale(dir,1);
  ctx.fillStyle='#2f7d52'; ctx.beginPath(); ctx.ellipse(0,0,13,9,0,0,7); ctx.fill();
  ctx.fillStyle='#256643';
  for (let i=-1;i<=1;i++){ ctx.beginPath(); ctx.ellipse(i*7,0,3.4,4,0,0,7); ctx.fill(); }
  ctx.fillStyle='#3fa06a'; ctx.beginPath(); ctx.arc(13,-1,4.5,0,7); ctx.fill();
  ctx.fillStyle='#06222e'; ctx.beginPath(); ctx.arc(15,-2,1.2,0,7); ctx.fill();
  ctx.fillStyle='#3fa06a';
  ctx.beginPath(); ctx.ellipse(-3,7,5,3,0.5,0,7); ctx.fill();
  ctx.beginPath(); ctx.ellipse(6,7,5,3,-0.5,0,7); ctx.fill();
  ctx.restore();
}
function drawJellyBody(tu, t) {
  const sway = Math.sin(t*2 + tu.ph);
  // 觸手（先畫，藏在傘下）
  ctx.strokeStyle='rgba(232,150,205,0.85)'; ctx.lineWidth=2; ctx.lineCap='round';
  for (let i=-2;i<=2;i++){
    const tx = i*3.5;
    ctx.beginPath(); ctx.moveTo(tx,2);
    ctx.quadraticCurveTo(tx+sway*3, 12, tx+sway*5, 21);
    ctx.stroke();
  }
  // 鐘形傘體（半透明粉紫）
  ctx.fillStyle='rgba(229,130,200,0.9)';
  ctx.beginPath();
  ctx.moveTo(-12,3);
  ctx.quadraticCurveTo(-13,-12,0,-12);
  ctx.quadraticCurveTo(13,-12,12,3);
  ctx.quadraticCurveTo(8,6,5,3);
  ctx.quadraticCurveTo(2,7,-1,3);
  ctx.quadraticCurveTo(-4,7,-7,3);
  ctx.quadraticCurveTo(-10,6,-12,3);
  ctx.closePath(); ctx.fill();
  // 傘內花紋 + 高光
  ctx.fillStyle='rgba(255,205,235,0.7)'; ctx.beginPath(); ctx.ellipse(0,-5,5,4,0,0,7); ctx.fill();
  ctx.fillStyle='rgba(255,255,255,0.5)'; ctx.beginPath(); ctx.ellipse(-4,-7,2,3,0,0,7); ctx.fill();
}

function drawPlaced(c, t) {
  for (const m of state.placed) {
    const x = m.worldX - c; if (x<-50||x>view.w+50) continue;
    const sy = surfaceY(m.worldX, t);
    if (m.type === 'scoop') {
      // 作用範圍
      ctx.strokeStyle='rgba(120,200,255,0.22)'; ctx.lineWidth=2; ctx.setLineDash([5,5]);
      ctx.beginPath(); ctx.ellipse(x, sy, MACHINE.scoop.range, 14, 0,0,7); ctx.stroke(); ctx.setLineDash([]);
      // 浮台
      ctx.fillStyle='#3e6b8c'; ctx.fillRect(x-13, sy-9, 26, 8);
      ctx.fillStyle='#ffcc44'; ctx.fillRect(x-13, sy-11, 26, 3);
      // 撈網臂
      const sw=Math.sin(t*3+m.worldX)*4;
      ctx.strokeStyle='#9aa3a8'; ctx.lineWidth=2; ctx.lineCap='round';
      ctx.beginPath(); ctx.moveTo(x+9, sy-7); ctx.lineTo(x+16+sw, sy+12); ctx.stroke();
      ctx.fillStyle='rgba(200,220,160,0.6)'; ctx.beginPath(); ctx.arc(x+16+sw, sy+13, 5, 0, Math.PI); ctx.fill();
      ctx.font='13px sans-serif'; ctx.textAlign='center'; ctx.fillStyle='#fff'; ctx.fillText('🗑️', x, sy-15);
    } else {
      const inZone = state.zones.some(z=>z.p>0 && m.worldX>z.x0-MACHINE.filter.range && m.worldX<z.x1+MACHINE.filter.range);
      // 下伸管
      ctx.strokeStyle='#7fbfd0'; ctx.lineWidth=3; ctx.lineCap='round';
      ctx.beginPath(); ctx.moveTo(x, sy-2); ctx.lineTo(x, sy+44); ctx.stroke();
      // 浮台
      ctx.fillStyle='#2e8b9e'; ctx.fillRect(x-13, sy-9, 26, 8);
      ctx.fillStyle='#9be0ff'; ctx.fillRect(x-13, sy-11, 26, 3);
      ctx.font='13px sans-serif'; ctx.textAlign='center'; ctx.fillStyle='#fff'; ctx.fillText('💧', x, sy-15);
      if (inZone){
        ctx.fillStyle='rgba(220,250,255,0.65)';
        for(let i=0;i<5;i++){ const bx=x+Math.sin(t*2+i)*9; const by=sy+44-((t*42+i*26)%48); ctx.beginPath(); ctx.arc(bx,by,2,0,7); ctx.fill(); }
      } else {
        // 提示：不在污染區內、沒在工作
        ctx.font='9px sans-serif'; ctx.fillStyle='rgba(255,255,255,0.6)'; ctx.fillText('移到污染區', x, sy+24);
      }
    }
    // 耐久條（綠→黃→紅）
    const lifeFrac = Math.max(0, Math.min(1, m.life / MACHINE[m.type].life));
    ctx.fillStyle = 'rgba(0,0,0,0.45)'; ctx.fillRect(x-14, sy-31, 28, 4);
    ctx.fillStyle = lifeFrac>0.5 ? '#5fe08a' : lifeFrac>0.25 ? '#ffcc44' : '#ff5e6c';
    ctx.fillRect(x-14, sy-31, 28*lifeFrac, 4);
    // 船在附近 → 提示可收回
    if (Math.abs(m.worldX - state.boat.x) < 70) {
      ctx.font='10px sans-serif'; ctx.textAlign='center'; ctx.fillStyle='rgba(255,255,255,0.75)';
      ctx.fillText('↑ 靠近可收回', x, sy-40);
    }
  }
}

function drawLine(c, t) {
  const L=state.line; if(!L.active && L.depth<=0) return;
  const bx=state.boat.x-c; const topY=surfaceY(state.boat.x,t)-26;
  const tipY=surfaceY(state.boat.x,t)+L.depth;
  ctx.strokeStyle='rgba(255,255,255,0.6)'; ctx.lineWidth=1.5;
  ctx.beginPath(); ctx.moveTo(bx+14, topY); ctx.lineTo(bx+14, tipY); ctx.stroke();
  // 鉤 / 鉤到的垃圾
  if (L.caught){ ctx.save(); ctx.translate(bx+14, tipY+2); ctx.scale(0.85,0.85); drawTrashItem(L.caught.key); ctx.restore(); }
  else {
    ctx.fillStyle='#ddd'; ctx.beginPath(); ctx.arc(bx+14, tipY, 3, 0, 7); ctx.fill();
    // 附近有垃圾或海龜 → 顯示提示
    if (L.phase==='down'){
      let bite=false;
      for (const tr of state.trash){
        const ty=trashScreenY(tr, t);
        if (Math.abs(tr.worldX-state.boat.x)<55 && Math.abs(ty-tipY)<50){ bite=true; break; }
      }
      const tu=state.turtle;
      if (tu && tu.hideT<=0){
        const ty=trashScreenY(tu, t);
        if (Math.abs(tu.worldX-state.boat.x)<60 && Math.abs(ty-tipY)<60){ bite=true; }
      }
      if (bite){ ctx.font='bold 16px sans-serif'; ctx.fillStyle='#ffcc44'; ctx.fillText('❗', bx+14, tipY-12); }
    }
  }
}

function drawBoat(c, t) {
  const x=state.boat.x-c;
  const y=surfaceY(state.boat.x,t);
  const slope=(surfaceY(state.boat.x+14,t)-surfaceY(state.boat.x-14,t))/28;
  ctx.save();
  ctx.translate(x,y);
  ctx.rotate(Math.atan(slope));
  const dir=state.boat.dir;
  // 倒影
  ctx.save(); ctx.globalAlpha=0.15; ctx.scale(1,-1); ctx.fillStyle='#3a2a1a';
  ctx.fillRect(-34,2,68,16); ctx.restore();
  // 船身
  ctx.fillStyle='#8a5a32';
  ctx.beginPath();
  ctx.moveTo(-36,-4); ctx.lineTo(36,-4);
  ctx.lineTo(26,18); ctx.lineTo(-26,18); ctx.closePath(); ctx.fill();
  ctx.fillStyle='#a96e3e'; ctx.fillRect(-36,-8,72,5);
  ctx.fillStyle='#6f4626'; ctx.fillRect(-26,-3,52,3);
  // 駕駛艙
  ctx.fillStyle='#d9e6ef'; ctx.fillRect(-8,-24,18,18);
  ctx.fillStyle='#4a7fa5'; ctx.fillRect(-5,-21,12,8);
  // 桅杆與旗
  ctx.strokeStyle='#5a3a20'; ctx.lineWidth=2; ctx.beginPath(); ctx.moveTo(-20,-8); ctx.lineTo(-20,-40); ctx.stroke();
  ctx.fillStyle='#19c3a6'; ctx.beginPath(); ctx.moveTo(-20,-40); ctx.lineTo(-4,-35); ctx.lineTo(-20,-30); ctx.fill();
  // 漁夫
  ctx.save(); ctx.translate(14*dir,0); ctx.scale(dir,1);
  ctx.fillStyle='#f4c542'; ctx.beginPath(); ctx.arc(0,-26,4,Math.PI,0); ctx.fill(); // 帽
  ctx.fillStyle='#f4c542'; ctx.fillRect(-5,-25,10,2);
  ctx.fillStyle='#e8b98e'; ctx.beginPath(); ctx.arc(0,-20,4,0,7); ctx.fill();        // 頭
  ctx.fillStyle='#d94f4f'; ctx.fillRect(-4,-16,8,12);                                 // 身
  // 釣竿
  ctx.strokeStyle='#3a2410'; ctx.lineWidth=1.5; ctx.beginPath(); ctx.moveTo(2,-12); ctx.lineTo(14,-30); ctx.stroke();
  ctx.restore();
  ctx.restore();
}

const BUILD_STYLE = {
  recycler: { wall:'#5d6b78', roof:'#39485a', accent:'#9fb4c2', label:'回收商' },
  micropc:  { wall:'#2f8f7c', roof:'#1f6256', accent:'#8ef0d8', label:'點點塑' },
  artshop:  { wall:'#c96a8e', roof:'#933f63', accent:'#ffd6e6', label:'海廢文創小舖' },
};
function drawDock(c, t) {
  const left = SHOPS.recycler.x - 70, right = SHOPS.artshop.x + 95;
  const lx = left - c, rx = right - c;
  const onScreen = !(rx < -40 || lx > view.w + 40);
  ctx.save();
  if (onScreen) {
    const y = seaY - 6;          // 碼頭固定在岸邊，不隨海浪上下浮動
    // 連續木棧道：柱 + 平台
    ctx.fillStyle='#6b4a2b';
    for (let wx=left+10; wx<right; wx+=46){ const px=wx-c; if(px<-20||px>view.w+20) continue; ctx.fillRect(px, y, 9, view.h); }
    ctx.fillStyle='#8a6038'; ctx.fillRect(lx, y-12, rx-lx, 16);
    ctx.fillStyle='#a87a48'; ctx.fillRect(lx, y-15, rx-lx, 4);
  }
  const near = nearShop();
  drawBuilding('recycler', c, t, near==='recycler');
  drawBuilding('micropc',  c, t, near==='micropc');
  drawBuilding('artshop',  c, t, near==='artshop');
  ctx.restore();
}

// 單棟海岸建築：主體 + 屋頂 + 招牌 + icon；靠近時發光並提示
function drawBuilding(key, c, t, near) {
  const shop = SHOPS[key], st = BUILD_STYLE[key];
  const x = shop.x - c; if (x < -90 || x > view.w + 90) return;
  const baseY = seaY - 18;     // 固定在棧道上，不隨海浪浮動
  const w = 80, h = 56, top = baseY - h;
  ctx.save();
  if (near){ ctx.shadowColor = 'rgba(255,220,120,0.9)'; ctx.shadowBlur = 22; }
  // 牆體
  ctx.fillStyle = st.wall; ctx.fillRect(x - w/2, top, w, h);
  ctx.shadowBlur = 0;
  // 屋頂
  ctx.fillStyle = st.roof;
  ctx.beginPath(); ctx.moveTo(x - w/2 - 6, top); ctx.lineTo(x, top - 26); ctx.lineTo(x + w/2 + 6, top); ctx.closePath(); ctx.fill();
  // 門
  ctx.fillStyle = 'rgba(20,30,40,0.55)'; ctx.fillRect(x - 11, baseY - 26, 22, 26);
  ctx.fillStyle = st.accent; ctx.fillRect(x - 11, baseY - 28, 22, 3);
  // 窗
  ctx.fillStyle = st.accent;
  ctx.fillRect(x - w/2 + 8, top + 14, 12, 12); ctx.fillRect(x + w/2 - 20, top + 14, 12, 12);
  // 店家特色裝飾
  if (key === 'micropc'){ // 工廠煙囪
    ctx.fillStyle = st.roof; ctx.fillRect(x + 14, top - 22, 9, 18);
  } else if (key === 'artshop'){ // 紅白遮陽棚
    for (let i=0;i<5;i++){ ctx.fillStyle=(i%2)?'#ffffff':'#d94f4f'; ctx.fillRect(x - w/2 + i*(w/5), top + h - 2, w/5, 7); }
  } else if (key === 'recycler'){ // 回收三角標
    ctx.fillStyle = st.accent; ctx.font='14px sans-serif'; ctx.textAlign='center'; ctx.fillText('♻', x, top + 12);
  }
  // 大 icon
  ctx.font = '26px sans-serif'; ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(shop.icon, x, top + h/2 + 2);
  // 招牌（屋頂上方）
  const sw = Math.max(64, st.label.length * 13 + 16), sy = top - 30;
  ctx.fillStyle = '#f3e4c4'; ctx.fillRect(x - sw/2, sy - 13, sw, 22);
  ctx.strokeStyle = '#b9925a'; ctx.lineWidth = 1.5; ctx.strokeRect(x - sw/2, sy - 13, sw, 22);
  ctx.fillStyle = '#5a3a1a'; ctx.font = 'bold 13px "Microsoft JhengHei",sans-serif';
  ctx.fillText(shop.icon + st.label, x, sy - 1);
  // 靠近提示
  if (near){
    const bob = Math.sin(t*4)*3;
    ctx.fillStyle = 'rgba(255,204,68,0.95)'; ctx.font = 'bold 12px "Microsoft JhengHei",sans-serif';
    ctx.fillText('▼ 點下方按鈕進入', x, baseY + 18 + bob);
  }
  ctx.textBaseline = 'alphabetic';
  ctx.restore();
}

// 快取 HUD 元素參照與上次寫入的值，避免每幀重複 getElementById 與不必要的 DOM 寫入（reflow）造成卡頓
const HUD = {
  coins:    document.getElementById('coins'),
  hold:     document.getElementById('hold'),
  holdMax:  document.getElementById('holdMax'),
  statHold: document.getElementById('stat-hold'),
  ecoFill:  document.getElementById('ecoFill'),
  ecoVal:   document.getElementById('ecoVal'),
  ecoIcon:  document.getElementById('ecoIcon'),
  clock:    document.getElementById('clock'),
  clockIcon:document.getElementById('clockIcon'),
  btnCast:  document.getElementById('btnCast'),
  btnScoop: document.getElementById('btnScoop'),
  btnFilter:document.getElementById('btnFilter'),
  commission:document.getElementById('commission-hud'),
};
const _hudPrev = {};
function setText(el, key, val){ if (_hudPrev[key] !== val){ _hudPrev[key] = val; el.textContent = val; } }
function updateHUD() {
  setText(HUD.coins,   'coins',   Math.floor(state.coins));
  setText(HUD.hold,    'hold',    state.hold.length);
  setText(HUD.holdMax, 'holdMax', holdFor(state.up.hold));
  // 魚艙滿了變紅
  const full = state.hold.length >= holdFor(state.up.hold);
  if (_hudPrev.full !== full){ _hudPrev.full = full; HUD.statHold.classList.toggle('full', full); }
  const eco=Math.round(state.eco);
  if (_hudPrev.eco !== eco){
    _hudPrev.eco = eco;
    HUD.ecoFill.style.width = eco+'%';
    HUD.ecoVal.textContent  = eco+'%';
    HUD.ecoIcon.textContent = eco>=66 ? '💚' : eco>=33 ? '💛' : '💔';
  }
  // 時鐘
  const h=(state.time/DAY_LEN)*24; const hh=Math.floor(h), mm=Math.floor((h-hh)*60);
  setText(HUD.clock,     'clock',     String(hh).padStart(2,'0')+':'+String(mm).padStart(2,'0'));
  setText(HUD.clockIcon, 'clockIcon', isNight()?'🌙':'☀️');
  // 釣魚鈕：靠岸時變成「進入建築」
  setText(HUD.btnCast, 'btnCast', nearShop() ? '🏪 進入' : '🎣 釣垃圾');
  renderCommissionHud();
  updateMachineBtns();   // 每幀更新（讓「靠近可收回」即時反映）
}
// 常駐委託需求小卡：顯示目前委託還缺哪些垃圾（教學進行中先隱藏）
function renderCommissionHud() {
  const el = HUD.commission; if (!el) return;
  if (!running || tutStep >= 0) {
    if (_hudPrev.comHtml !== '__hidden') { _hudPrev.comHtml = '__hidden'; el.classList.add('hidden'); }
    return;
  }
  // 海洋全淨化後不再生成垃圾 → 委託無法再完成，改顯示收尾訊息、不再催（避免永遠卡著「還需 ×N」）
  if (allZonesClean(state)) {
    const html = `🎨 委託：<b>海洋已淨化，委託任務告一段落 ✅</b>`;
    if (_hudPrev.comHtml !== html) { _hudPrev.comHtml = html; el.innerHTML = html; el.classList.remove('hidden'); }
    return;
  }
  const com = currentCommission(), prog = state.commissionProgress;
  const parts = [];
  for (const k in com.need) {
    const rem = com.need[k] - (prog[k]||0);
    if (rem > 0) parts.push(`${TRASH_BY_KEY[k].emoji}×${rem}`);
  }
  const body = parts.length ? `還需 ${parts.join('　')}` : '材料已備齊，去小舖領獎勵！';
  const html = `🎨 委託：<b>${com.emoji}${com.title}</b><br/>${body}`;
  if (_hudPrev.comHtml !== html) { _hudPrev.comHtml = html; el.innerHTML = html; el.classList.remove('hidden'); }
}
function updateMachineBtns() {
  const near = type => state.placed.some(p=>p.type===type && Math.abs(p.worldX-state.boat.x)<70);

let toastCount=0;
function toast(x,y,text,cls){
  const el=document.createElement('div');
  el.className='toast '+(cls||'');
  el.textContent=text;
  el.style.left=Math.max(8,Math.min(view.w-8,x))+'px';
  el.style.top=y+'px';
  el.style.transform='translateX(-50%)';
  document.getElementById('toast-layer').appendChild(el);
  setTimeout(()=>el.remove(),1100);
}

function costOf(def){ return Math.round(def.base * Math.pow(def.mul, def.lvl - def.min)); }

function renderShop(key){
  key = key || shopOverlay.dataset.shop;
  document.getElementById('shopCoins').textContent=Math.floor(state.coins);
  const body=document.getElementById('shopBody');
  if (key==='micropc'){
    body.innerHTML=renderMachines();

    return;
  }
  if (key==='artshop'){ renderArtshop(body); return; }
  // recycler：裝備升級
  let html='';
  for (const k in DEFS){
    const d=DEFS[k]; if (d.cat!=='upgrade') continue;
    const owned = d.lvl>d.min || (d.min>0 && d.lvl>=d.min) ? true : d.lvl>d.min;
    const maxed = d.lvl>=d.max;
    const cost = costOf(d);
    const can = !maxed && state.coins>=cost;
    // 等級點（單次購買的機器不顯示等級格）
    let pips='';

    if (maxed) btn=`<button class="buy-btn maxed" disabled>${d.once?'已安裝':'滿級'}</button>`;
    else btn=`<button class="buy-btn" data-buy="${k}" ${can?'':'disabled'}>${d.lvl===0?'購買':'升級'}<span class="price">🪙 ${cost}</span></button>`;

        <div class="item-desc">${descOf[k](d.lvl)}</div>

// 稽查員考核評等：依「清得多快、救了幾隻、完成幾筆委託」給 S/A/B/C
function computeRank(){
  let pts = 0;
  pts += Math.min(state.stats.rescued, 3) * 2;       // 拯救生物 每隻 +2（最多 +6）
  pts += Math.min(state.stats.commissions, 6) * 1;   // 完成委託 每筆 +1（最多 +6）
  if (state.day <= 2) pts += 6;                       // 通關速度（用幾天清完全部）
  else if (state.day <= 4) pts += 4;
  else if (state.day <= 6) pts += 2;
  let rank, comment;
  if (pts >= 13){ rank='S'; comment='傳奇稽查員！海洋因你煥然一新，長官親自頒獎。'; }
  else if (pts >= 9){ rank='A'; comment='表現優異！這片海洋以你為榮。'; }
  else if (pts >= 5){ rank='B'; comment='做得不錯，海洋明顯變乾淨了。'; }
  else { rank='C'; comment='任務達成！下次救多一點海龜、多接委託可拿更高評等。'; }
  return { rank, comment, pts };
}

// ---------- 海廢文創小舖：委託 + 賤價賣垃圾 ----------
function trashCounts(){
  const m = {};
  for (const it of state.hold) m[it.key] = (m[it.key]||0)+1;
  return m;
}
function currentCommission(){ return COMMISSIONS[state.commissionIdx % COMMISSIONS.length]; }
function canFulfill(com, counts){
  for (const k in com.need) if ((counts[k]||0) < com.need[k]) return false;
  return true;
}
function incomeMul(){ return 1 + state.up.sonar*0.08; }   // 雷達升級提升委託/賣垃圾收入
function renderArtshop(body){
  const counts = trashCounts();
  const com = currentCommission();
  const prog = state.commissionProgress;
  const reward = Math.round(com.reward * incomeMul());
  // 是否手上有任何「這個委託還需要的」材料可繳
  const canSubmit = Object.keys(com.need).some(k => (counts[k]||0)>0 && (prog[k]||0)<com.need[k]);
  const needRows = Object.keys(com.need).map(k=>{
    const t = TRASH_BY_KEY[k]; const req = com.need[k];
    const done = prog[k]||0; const have = counts[k]||0;
    const full = done>=req;
    const hint = full ? '✓ 已備齊' : (have>0 ? `手上 ${have} 件可繳` : `還缺 ${req-done}`);
    return `<div class="need-row">
      <span>${t.emoji} ${t.name} <span style="opacity:.6;font-size:12px">(${hint})</span></span>
      <b style="color:${full?'#7ef0a0':'#ffcc44'}">已交 ${done}/${req}</b>
    </div>`;
  }).join('');
  const sellRows = TRASH_TYPES.map(t=>{
    const have = counts[t.key]||0;
    const price = Math.max(1, Math.round(t.sell*incomeMul()));
    return `<div class="need-row">
      <span>${t.emoji} ${t.name} <span style="opacity:.55">×${have}</span></span>
      <button class="buy-btn" data-sell="${t.key}" ${have<=0?'disabled':''} style="min-width:92px">賣 1 個<span class="price">🪙 ${price}</span></button>
    </div>`;
  }).join('');
  body.innerHTML = `
    <div class="item" style="display:block;border-color:rgba(255,204,68,0.4)">
      <div class="item-title" style="font-size:16px">📋 本週委託：${com.emoji} ${com.title}</div>
      <div class="item-desc" style="margin:4px 0 8px">完成可得 <b style="color:var(--gold)">🪙 ${reward}</b>。可以<b>先交手上的、之後再補</b>，材料不必一次湊齊，湊滿自動完成！</div>
      <div class="need-list">${needRows}</div>
      <button class="big-btn" id="btnDeliver" ${canSubmit?'':'disabled'} style="margin-top:10px;${canSubmit?'':'opacity:.45'}">📥 繳交手上的材料</button>
    </div>
    <div class="info-text" style="margin:10px 0 6px">🎒 背包 <b>${state.hold.length}/${holdFor(state.up.hold)}</b>　抓錯的垃圾可在這裡<b>賤價賣掉</b>清出空間（防呆機制）：</div>
    <div class="need-list">${sellRows}</div>
    <button class="menu-btn alt" id="btnSellExtra" style="margin-top:8px">💱 一鍵賣掉「非委託所需」的垃圾</button>
  `;
  const d = body.querySelector('#btnDeliver'); if (d) d.addEventListener('click', deliverCommission);
  body.querySelectorAll('[data-sell]').forEach(b=>b.addEventListener('click',()=>sellTrash(b.dataset.sell,1)));
  const se = body.querySelector('#btnSellExtra'); if (se) se.addEventListener('click', sellExtra);
}
// 繳交：把手上「委託還需要的」材料先交上去（可分批），湊滿自動完成
function deliverCommission(){
  const com = currentCommission();
  const prog = state.commissionProgress;
  let moved = 0;
  for (const k in com.need){
    let remaining = com.need[k] - (prog[k]||0);
    for (let i=state.hold.length-1;i>=0 && remaining>0;i--){
      if (state.hold[i].key===k){ state.hold.splice(i,1); prog[k]=(prog[k]||0)+1; remaining--; moved++; }
    }
  }
  const complete = Object.keys(com.need).every(k => (prog[k]||0) >= com.need[k]);
  if (complete){
    const reward = Math.round(com.reward * incomeMul());
    state.coins += reward; state.stats.earned += reward; state.stats.commissions++;
    const ci = state.commissionIdx % COMMISSIONS.length;   // 記錄「完成了哪一件作品」給結算成果展
    state.commDone[ci] = (state.commDone[ci] || 0) + 1;
    state.commissionIdx = (state.commissionIdx + 1) % COMMISSIONS.length;
    state.commissionProgress = {};
    sfx('sell');
    toast(view.w/2, view.h*0.4, `🎨 委託完成！+${reward}🪙`, 'coin');
  } else if (moved>0){
    sfx('buy');
    toast(view.w/2, view.h*0.42, `📥 已先收下 ${moved} 件，背包空出來了！剩下的再補就好`, 'eco');
  } else {
    sfx('error');
    toast(view.w/2, view.h*0.45, '背包裡沒有這個委託需要的垃圾', 'warn'); return;
  }
  updateHUD(); checkQuest(); save(); renderShop();
}
function sellTrash(key, n){
  const price = Math.max(1, Math.round(TRASH_BY_KEY[key].sell*incomeMul()));
  let sold=0, total=0;
  for (let i=state.hold.length-1;i>=0 && sold<n;i--){ if (state.hold[i].key===key){ state.hold.splice(i,1); sold++; total+=price; } }
  if (!sold){ sfx('error'); return; }
  state.coins += total; state.stats.earned += total;
  sfx('buy'); updateHUD(); checkQuest(); save(); renderShop();
}
function sellExtra(){
  const com = currentCommission(), prog = state.commissionProgress;
  const keep = {};   // 只保留「委託尚未繳交、還需要」的數量，其餘賣掉
  for (const k in com.need) keep[k] = Math.max(0, com.need[k] - (prog[k]||0));
  let total=0, sold=0;
  for (let i=state.hold.length-1;i>=0;i--){
    const k = state.hold[i].key;
    if (keep[k] > 0){ keep[k]--; continue; }
    total += Math.max(1, Math.round(TRASH_BY_KEY[k].sell*incomeMul()));
    state.hold.splice(i,1); sold++;
  }
  if (!sold){ toast(view.w/2, view.h*0.45, '沒有多餘的垃圾可賣', 'warn'); sfx('error'); return; }
  state.coins += total; state.stats.earned += total;
  sfx('sell'); toast(view.w/2, view.h*0.4, `賣掉 ${sold} 件多餘垃圾 +${total}🪙`, 'coin');
  updateHUD(); checkQuest(); save(); renderShop();
}
function buy(key){
  const d=DEFS[key]; const cost=costOf(d);
  if (d.lvl>=d.max || state.coins<cost) { sfx('error'); return; }
  state.coins-=cost; d.lvl++; state.up[key]=d.lvl;
  sfx('buy'); updateMachineBtns(); updateHUD();
  toast(view.w/2, view.h*0.5, `${d.icon} ${d.name} ${d.lvl===d.min+1&&d.min===0?'已安裝':'Lv'+d.lvl}`, 'eco');
  checkQuest(); save();
  renderShop();
}

function loop(now){
  if (!running){ return; }
  const dt=Math.min(0.05,(now-lastT)/1000)||0; lastT=now;
  if (rescue) updateRescue(dt);             // 救援海龜時：世界凍結，只跑救援倒數
  else if (!shopOpen() && !paused) update(dt);   // 商店或暫停選單開啟時凍結模擬
  render();
  requestAnimationFrame(loop);
}

  { ico:'🌊', text:'這裡的海被<b>塑膠垃圾與微粒</b>嚴重污染，魚群不敢靠近，<b>漁民捕不到魚</b>，生計眼看就要撐不下去。' },
  { ico:'🎯', text:'你的任務：<b>釣起海洋垃圾</b>、接<b>海廢文創委託</b>賺錢、向<b>🏭點點塑</b>買淨化設備清除污染，還能<b>🐢🪼拯救受困海龜與水母</b>。' },
  { ico:'🏆', text:'把這片海洋恢復成以往的模樣，幫漁民找回生計——<b>淨化全部海域，立功調回台北！</b><br/><span style="opacity:.7;font-size:14px">🖥️ A／D 或 ←→ 移動，空白鍵釣垃圾　📱 左右鍵移動、點海面釣垃圾</span>' },
];
function renderStory(){
  const p = STORY[storyPage];
  document.getElementById('storyIco').textContent = p.ico;
  document.getElementById('storyText').innerHTML = p.text;
  const dots = STORY.map((_,i)=>`<span class="dot ${i===storyPage?'on':''}"></span>`).join('');
  document.getElementById('storyDots').innerHTML = dots;
  document.getElementById('storyPrev').disabled = storyPage===0;
  const last = storyPage===STORY.length-1;
  document.getElementById('storyNext').classList.toggle('hidden', last);
  document.getElementById('btnStart').classList.toggle('hidden', !last);
}
document.getElementById('storyPrev').addEventListener('click', ()=>{ if(storyPage>0){ storyPage--; renderStory(); } });
document.getElementById('storyNext').addEventListener('click', ()=>{ if(storyPage<STORY.length-1){ storyPage++; renderStory(); } });
renderStory();

// ============================================================
//  啟動
// ============================================================
function startGame(){
  resize();
  if (!state) state=freshState();
  syncDefs();
  // 初始魚很少（海洋還很髒）；漂浮垃圾（釣取目標）給足
  for(let i=0;i<4;i++) spawnFish();
  for(let i=0;i<16;i++) spawnTrash();
  updateMachineBtns(); updateHUD(); checkQuest(); updateSoundUI();
  initAudio();   // 開始遊戲是使用者手勢，可安全建立音訊
  paused = false;
  allCleanCelebrated = state.zones.every(z=>z.p<=CLEAN_P);   // 已全淨化的存檔不重複慶祝
  document.getElementById('start-overlay').classList.add('hidden');
  checkOrientation();
  if (!state.tutDone) startTutorial(); else { tutStep = -1; showQuest(); }
  running=true; lastT=performance.now();
  requestAnimationFrame(loop);
}

document.getElementById('btnStart').addEventListener('click', ()=>{
  load(); // 若有存檔則沿用
  startGame();
});
document.getElementById('btnReset').addEventListener('click', ()=>{
  localStorage.removeItem(SAVE_KEY); state=freshState(); syncDefs();
  toast(view.w/2, view.h*0.5, '已清除存檔', 'warn');
});

// 自動暫停（切到背景）
document.addEventListener('visibilitychange', ()=>{ if(document.hidden){ clearKeys(); save(); } });
window.addEventListener('beforeunload', save);
// 防止手機長按 / 右鍵跳出選單影響操作
window.addEventListener('contextmenu', e => { if (running) e.preventDefault(); });

// 初次載入
resize();
// 若已有存檔，開始畫面按鈕仍會載入；先畫一張靜態海面
state=freshState();
render();

})();

  </script>
